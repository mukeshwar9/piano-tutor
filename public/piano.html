<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
<title>Piano</title>
<style>
:root{
  --bg:#0b0f17;--card:#131a27;--line:#1c2433;--line2:#2a3446;
  --txt:#e8edf5;--txt2:#b7c2d6;--mut:#8b97ab;--dim:#5d687c;
  --blue:#4da3ff;--green:#3ddc84;--amber:#ffb020;--red:#ff5252;
  --rh:#8cc6ff;--lh:#ff9ff0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
/* 1rem is set from the viewport height in JS (20px at 1080 tall), so the text scales with the TV. */
#c{position:absolute;left:0;top:0;width:100%;height:100%}
.side{position:absolute;top:1.2rem;display:flex;flex-direction:column;gap:.9rem;font-variant-numeric:tabular-nums;line-height:1.25}
.side .lbl{font-size:.8rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
.side .val{font-size:1.6rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sub{font-size:.95rem;color:var(--txt2)}
#left{text-align:left}
#right{text-align:right}
#title{font-size:1.5rem;font-weight:800;line-height:1.15}
#status{font-size:.9rem;color:var(--txt2);line-height:1.4}
#status b.ok{color:var(--green)}#status b.bad{color:var(--amber)}
#hint{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);background:rgba(42,18,22,.95);border:.12rem solid var(--red);border-radius:.8rem;padding:.6rem 1.6rem;font-size:1.6rem;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .25s ease;pointer-events:none}
#hint.on{opacity:1}
#listen{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);background:rgba(16,38,28,.95);border:.12rem solid var(--green);border-radius:.8rem;padding:.6rem 1.6rem;font-size:1.6rem;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .25s ease;pointer-events:none;text-align:center}
#listen.on{opacity:1}
#listen .sub{display:block;font-size:.95rem;font-weight:600;color:var(--txt2)}
#listen .meter{display:none;margin:.5rem 0 .1rem;height:.5rem;border-radius:.25rem;background:rgba(255,255,255,.14);overflow:hidden}
#listen.whole .meter{display:block}
#listen .meter i{display:block;height:100%;width:0;background:var(--green)}
#toast{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);background:rgba(19,26,39,.95);border:.12rem solid var(--blue);border-radius:.8rem;padding:.6rem 1.6rem;font-size:1.6rem;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .25s ease;pointer-events:none}
#toast.on{opacity:1}
#want span.right{color:var(--rh)}#want span.left{color:var(--lh)}
#loopBox{display:none}#loopBox.on{display:block}
#timeBox{display:none}#timeBox.on{display:block}
#timeVal.early{color:var(--amber)}#timeVal.late{color:var(--amber)}#timeVal.ontime{color:var(--green)}#timeVal.miss{color:var(--red)}
#count{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:9rem;font-weight:800;color:var(--txt);opacity:0;pointer-events:none;text-shadow:0 .3rem 1.2rem rgba(0,0,0,.6)}
#count.on{opacity:.9}
#loopVal{font-size:2.2rem;letter-spacing:.15em;color:var(--green)}
#keys{font-size:.8rem;color:var(--txt2);opacity:.65;line-height:1.5}
#panel{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);max-width:46rem;background:rgba(19,26,39,.95);border:.12rem solid var(--blue);border-radius:.8rem;padding:1rem 1.6rem;text-align:center;display:none}
#panel.on{display:block}
#panel h1{font-size:1.7rem;font-weight:800;margin-bottom:.4rem}
#panel p{font-size:1.05rem;color:var(--txt2);line-height:1.45}
#panel p b{color:var(--txt)}
#panel .step{font-size:.85rem;font-weight:700;color:var(--blue);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.3rem}
#panel .warn{color:var(--amber);margin-top:.4rem}
#panel .gold{color:var(--amber)}
#best{font-size:.95rem;color:var(--txt2)}#best b{color:var(--amber)}
#progress{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);width:min(60rem,92%);max-height:calc(100% - 2.4rem);overflow:hidden;background:rgba(19,26,39,.97);border:.12rem solid var(--amber);border-radius:.8rem;padding:1rem 1.6rem;display:none}
#progress.on{display:block}
#progress h1{font-size:1.7rem;font-weight:800;margin-bottom:.2rem}
#progress .sub{font-size:.95rem;color:var(--txt2);margin-bottom:.6rem}
#progress table{width:100%;border-collapse:collapse;font-size:1.15rem;font-variant-numeric:tabular-nums}
#progress th{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;text-align:right;padding:.2rem .6rem}
#progress td{padding:.3rem .6rem;text-align:right;border-top:.06rem solid var(--line2)}
#progress th:first-child,#progress td:first-child{text-align:left}
#progress td.cur{color:var(--blue);font-weight:800}
#progress .badge{color:var(--amber);font-weight:800}
#progress .recent{margin-top:.8rem;font-size:.95rem;color:var(--txt2);line-height:1.5}
/* Tutorial mode: every text is 1.6rem (32 px on a 1080-tall TV) or bigger. */
#tutor{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);width:min(84rem,94%);background:rgba(19,26,39,.97);border:.12rem solid var(--blue);border-radius:.8rem;padding:1rem 1.8rem;display:none;text-align:left}
body.tutor #tutor{display:block}
body.tutor #left,body.tutor #right,body.tutor #hint,body.tutor #panel{display:none}
body.tutor #toast{z-index:5}
#tutor .tag{font-size:1.6rem;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
#tutor h1{font-size:2.6rem;font-weight:800;line-height:1.15;margin:.2rem 0 .4rem}
#tutor .text{font-size:2rem;line-height:1.35;color:var(--txt)}
#tutor .text+.text{margin-top:.4rem}
#tutor .ask{font-size:2.6rem;font-weight:800;color:var(--amber);line-height:1.2;margin:.3rem 0}
#tutor .prog{font-size:1.6rem;color:var(--txt2);margin-top:.2rem}
#tutor .msg{font-size:2rem;font-weight:800;margin-top:.5rem;min-height:2.7rem;line-height:1.3}
#tutor .msg.ok{color:var(--green)}#tutor .msg.bad{color:var(--amber)}
#tutor .keys{font-size:1.6rem;color:var(--txt2);margin-top:.7rem;border-top:.06rem solid var(--line2);padding-top:.6rem}
#tutor ul.items{list-style:none;font-size:2rem;line-height:1.4;margin:.3rem 0}
#tutor ul.items li:before{content:"✓ ";color:var(--green);font-weight:800}
#tutor .next{font-size:2rem;color:var(--amber);font-weight:700;margin-top:.5rem}
#tutor .strip{display:flex;gap:.5rem;margin:.5rem 0 .6rem}
#tutor .strip span{flex:1;text-align:center;font-size:1.6rem;font-weight:800;padding:.3rem 0;border-radius:.5rem;border:.12rem solid var(--line2);color:var(--dim)}
#tutor .strip span.passed{background:#1d4a34;border-color:var(--green);color:#d8f5e6}
#tutor .strip span.current{border-color:var(--blue);color:var(--txt)}
#tutor .strip span.open{color:var(--txt2)}
#tutor ol.list{list-style:none}
#tutor ol.list li{display:flex;align-items:baseline;gap:1rem;font-size:1.7rem;line-height:1.2;padding:.1rem .8rem;border-radius:.5rem;border:.12rem solid transparent;color:var(--txt)}
#tutor ol.list li b{width:2.2rem;color:var(--mut)}
#tutor ol.list li .goal{flex:1;font-size:1.6rem;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tutor ol.list li .st{font-weight:800;color:var(--mut)}
#tutor ol.list li.passed .st{color:var(--green)}#tutor ol.list li.progress .st{color:var(--amber)}
#tutor ol.list li.locked{color:var(--dim)}#tutor ol.list li.locked .goal{color:var(--dim)}
#tutor ol.list li.sel{background:#1c2a42;border-color:var(--blue)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="left" class="side">
  <div id="title">Loading song…</div>
  <div id="best"></div>
  <div><div class="lbl">Bar</div><div class="val" id="bar">-</div></div>
  <div><div class="lbl">Mode</div><div class="sub" id="mode">Wait mode · right hand</div></div>
  <div id="status"></div>
  <div id="keys">◀ ▶ song or lessons · ▲ hand · ⏯ loop · ⏪ hear · ⏩ wall</div>
</div>
<div id="right" class="side">
  <div><div class="lbl">Accuracy</div><div class="val" id="acc">-</div></div>
  <div><div class="lbl">Streak</div><div class="val" id="streak">0</div></div>
  <div><div class="lbl" id="wantLbl">Waiting for</div><div class="val" id="want">-</div></div>
  <div id="timeBox"><div class="lbl">Timing</div><div class="val" id="timeVal">-</div><div class="sub" id="timeSub"></div></div>
  <div id="loopBox"><div class="lbl" id="loopLbl">Loop</div><div class="val" id="loopVal"></div><div class="sub" id="loopSub"></div></div>
</div>
<div id="hint"></div>
<div id="toast"></div>
<div id="listen"></div>
<div id="count"></div>
<div id="panel"></div>
<div id="progress"></div>
<div id="tutor"></div>
<script src="/piano-core.js"></script>
<script src="/piano-lessons.js"></script>
<script src="/piano-sheet.js"></script>
<script src="/vendor/vexflow-4.2.5-bravura.js"></script>
<script src="/switch.js"></script>
<script>
(function () {
  "use strict";
  var P = window.PianoCore, S = window.PianoSheet;
  var VF = window.Vex && (window.Vex.Flow || window.Vex);
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("c"), ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  var LEAD_IN = 4;          // beats of falling notes before the first one reaches the hit line
  var LOOKAHEAD = 4.5;      // beats visible above the hit line
  var KEY_H = 0.16;         // on-screen keys, share of the screen height, on the very bottom edge
  var FLASH_MS = 700, HINT_MS = 2600;
  var ECHO_MS = 250;        // keys arriving this soon after Hear it first ends are still its echo
  var LIGHT_BEATS = 1;      // tempo mode lights the next keys this many beats before they are due
  // Per-hand colours: falling notes (white / black key lanes) and the keys a step is waiting for.
  var HAND = {
    right: { white: "#4da3ff", black: "#2f7fd6", want: "#8cc6ff" },
    left: { white: "#e26ad0", black: "#b9479f", want: "#ff9ff0" },
  };
  var HAND_NAMES = { right: "Right hand", left: "Left hand", both: "Both hands" };
  // Sheet music: the grand staff's share of the screen height in each view, its height in VexFlow
  // units (treble and bass staves with room for ledger lines and finger numbers) and colours.
  var VIEW_NAMES = { notes: "Falling notes only", both: "Sheet music and falling notes", sheet: "Sheet music only" };
  var SHEET_H = { both: 0.3, sheet: 0.5 };
  var STAFF_U = 235, TREBLE_Y = 22, BASS_Y = 122;
  var INK = "#d5dce8", PANEL = "#0f1724";

  var saved = null;         // calibration from the server (null until one is saved)
  var cal = null;           // calibration in this screen's device pixels
  var work = null;          // calibration being edited in the calibration flow
  var layout = null;
  var mode = "play";        // play | cal1 | cal2 | cal3
  var calWarn = "";

  var songs = [], songId = "", rawSong = null, song = null, session = null, clock = -LEAD_IN, paused = false;
  var hand = rememberedHand();  // right | left | both, as chosen; the session may fall back to both
  var loop = null;          // { from, to } bars while practising a loop
  var held = {};            // note -> true while the key is down
  var flash = {};           // note -> { color, until }
  var hintUntil = 0;
  var online = false, presence = null, light = null;
  var micMode = false;      // notes come from a microphone on the link page: wait mode is forgiving
  var listen = null;        // Hear it first while it plays: { plan, t0, clock, paused, label, whole, player }
  var listenReq = null, echoUntil = 0;  // listenReq: a request on its way, { whole, player } for the whole song
  var LONG_PRESS_MS = 600;  // holding the hear key this long plays the whole song (if the key repeats)
  var hearDownAt = 0;       // when the hear key went down (0: not held, or it already did its work)
  var DOUBLE_PRESS_MS = 500; // pressing the hear key twice this fast plays the whole song (a held key may not repeat on the Fire Stick)
  var hearTapAt = 0;        // when the hear key last started a bar (0: it did not, or the double press used it up)
  var PENDING_MS = 5000;    // a request to the server older than this is given up on: the next press starts afresh
  var wholeNote = "";       // why the whole song could not start or lost its sound, for the link page
  var fingers = rememberedFingers();  // finger numbers on the falling notes and lit keys
  var playMode = "wait", playSpeed = 1;  // what a finished play is recorded as (tempo mode sets both)
  var playStart = 0;        // Date.now() of the first key of this play, 0 before it starts
  var lastResult = null;    // server reply for the play that just finished: { play, score, previous }
  var progressOn = false, history = null;
  var view = rememberedView();        // notes | both | sheet
  var sheet = null;         // the current song as notation, with its rendered pages
  var marks = {};           // song beat of each step played this time through -> "ok" | "bad"
  var tempo = rememberedTempo();      // tempo mode (the song keeps time) instead of wait mode
  var speed = rememberedSpeed();      // tempo mode speed, percent of the song's tempo
  var metronome = rememberedOnOff("pianoMetronome", false);  // metronome click in tempo mode
  var clickVolume = rememberedClickVolume();                 // click loudness, 0-100
  var countInOn = rememberedOnOff("pianoCountIn", true);     // count-in clicks before a tempo-mode start
  var ramp = rememberedOnOff("pianoRamp", false);            // speed ramp: clean loop passes raise the speed
  var rampTarget = rememberedRampTarget();                   // speed the ramp climbs to, percent
  var audio = null, clickedTo = 0;  // Web Audio context for the clicks; song beat up to which clicks are scheduled
  var PL = window.PianoLessons;
  var tutor = null;         // tutorial mode while it is open: { screen: "menu" | "lesson", lessons, progress, sel, runner, ... }
  var tutorStash = null;    // the song the page had open, put back when the tutorial closes
  var tutorHear = null;     // a tutorial step being played to the player: { plan, t0, ms }

  // ---------- sizing ----------

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = Math.round(window.innerWidth * DPR); H = Math.round(window.innerHeight * DPR);
    canvas.width = W; canvas.height = H;
    document.documentElement.style.fontSize = Math.max(8, window.innerHeight / 54) + "px";
    applyCalibration();
    beacon();
  }

  function applyCalibration() {
    cal = saved ? P.scaleCalibration(saved, W) : P.defaultCalibration(W);
    if (work && work.screenPx !== W) { var m = work.mode; work = P.scaleCalibration(work, W); work.mode = m; }
    if (mode === "play") setLayout(cal);
    else setLayout(work);
    fitSong();
  }

  function setLayout(c) {
    layout = P.keyLayout(c);
    // Song info sits in the side margins outside the strip.
    var l = c.left / DPR, r = (W - c.right) / DPR, pad = window.innerHeight / 40;
    var ls = $("left").style, rs = $("right").style;
    ls.left = pad + "px"; ls.width = Math.max(120, l - 2 * pad) + "px";
    rs.right = pad + "px"; rs.width = Math.max(120, r - 2 * pad) + "px";
  }

  // ---------- song ----------

  function fitSong() {
    // A new keyboard range can move notes by an octave, so the song starts over when it changes.
    if (!rawSong || !cal) return;
    if (song && song.fitLow === cal.low && song.fitHigh === cal.high) return;
    song = P.fitSong(rawSong, cal.low, cal.high);
    song.fitLow = cal.low; song.fitHigh = cal.high;
    $("title").textContent = song.title;
    newSession();
  }

  // A fresh session for the current song, hand, loop and mode, with the clock in the lead-in (wait
  // mode) or the count-in (tempo mode).
  function newSession() {
    if (!song) return;
    cancelListen();
    loop = P.clampLoop(song, loop);
    session = tempo ? P.createTempoSession(song, { hand: hand, loop: loop, speed: speed, tolerant: micMode, countIn: P.countInBeats(countInOn, song.beatsPerBar || 4) }) : P.createSession(song, { hand: hand, loop: loop, tolerant: micMode });
    startClock(); paused = false; held = {}; playStart = 0; lastResult = null; marks = {};
    playMode = tempo ? "tempo" : "wait"; playSpeed = tempo ? speed / 100 : 1;
    showBest();
    modeText();
    lastSide = "";
    panel();
    report();
  }

  function modeText() {
    var only = song.hands.length < 2 ? " · " + song.hands[0] + " hand only" : "";
    var pace = session.tempo ? "Tempo " + session.speed + "% · " + Math.round(song.bpm * session.speed / 100) + " of " + song.bpm + " bpm" : "Wait mode · " + song.bpm + " bpm";
    if (session.tempo && ramp) pace += loop ? " · ramp " + session.speed + "% → " + rampTarget + "%" : " · ramp on (loop a bar)";
    if (session.tempo && metronome) pace += " · metronome";
    $("mode").textContent = pace.replace(" · ", " · " + HAND_NAMES[session.hand].toLowerCase() + only + " · ") + (song.shifted ? " · " + song.shifted + " notes moved an octave" : "") +
      (micMode ? " · mic: octave and top note" : "");
  }

  // The link page switched between the keyboard's MIDI and a microphone. Mic mode is forgiving (the
  // right note name within an octave, only a chord's top note) and works best one hand at a time.
  function setMicMode(on) {
    if (on === micMode) return;
    micMode = on;
    if (tutor) { if (tutor.runner) tutor.runner.setTolerant(on); return; }
    // Tempo mode starts over: which notes are judged changes with mic mode.
    if (session && session.tempo) newSession();
    else if (session) { session.setTolerant(on); modeText(); lastSide = ""; panel(); report(); }
    toast(on ? (session && session.hand === "both" && song.hands.length > 1 ? "Microphone: one hand at a time works best · ▲ hand" : "Microphone input · forgiving") : "Keyboard input");
  }

  function startClock() {
    clock = session.tempo ? session.range.start - session.range.countIn : session.range.start - LEAD_IN;
  }

  function rememberedTempo() {
    try { return localStorage.getItem("pianoTempo") === "on"; } catch (e) { return false; }
  }

  function rememberedSpeed() {
    var v = NaN;
    try { v = Number(localStorage.getItem("pianoSpeed")); } catch (e) {}
    return v ? P.clampSpeed(v) : 75;
  }

  // Link page (or T): tempo mode on or off. id is "on", "off" or "" to toggle. The song starts over.
  function setTempo(id) {
    if (mode !== "play") return;
    tempo = id === "on" ? true : id === "off" ? false : !tempo;
    try { localStorage.setItem("pianoTempo", tempo ? "on" : "off"); } catch (e) {}
    newSession();
    toast(tempo ? "Tempo mode · " + speed + "%" : "Wait mode");
  }

  // Link page slider (or - and =): tempo mode speed, 50-100% of the song's tempo. The song starts over
  // in tempo mode so the count-in sets the new pace.
  function setSpeed(pct) {
    var v = P.clampSpeed(pct);
    if (mode !== "play" || v === speed) return;
    speed = v;
    try { localStorage.setItem("pianoSpeed", String(speed)); } catch (e) {}
    if (tempo) newSession(); else report();
    toast("Tempo " + speed + "%" + (tempo ? "" : " (tempo mode is off)"));
  }

  function rememberedOnOff(key, dflt) {
    try { var v = localStorage.getItem(key); return v === null ? dflt : v === "on"; } catch (e) { return dflt; }
  }

  function rememberedClickVolume() {
    var v = NaN;
    try { v = parseInt(localStorage.getItem("pianoClickVolume"), 10); } catch (e) {}
    return v >= 0 && v <= 100 ? v : 60;
  }

  function rememberedRampTarget() {
    var v = NaN;
    try { v = Number(localStorage.getItem("pianoRampTarget")); } catch (e) {}
    return v ? P.clampSpeed(v) : P.RAMP_TARGET;
  }

  function saveSetting(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  // Link page (or K): the metronome click in tempo mode. id is "on", "off" or "" to toggle.
  function setMetronome(id) {
    if (mode !== "play") return;
    metronome = id === "on" ? true : id === "off" ? false : !metronome;
    saveSetting("pianoMetronome", metronome ? "on" : "off");
    if (session) modeText();
    report();
    toast((metronome ? "Metronome on" : "Metronome off") + (tempo ? "" : " (tempo mode only)"));
  }

  // Link page slider: click loudness, 0-100. One accent click plays so the level can be heard.
  function setClickVolume(v) {
    if (mode !== "play") return;
    clickVolume = Math.max(0, Math.min(100, Math.round(Number(v)) || 0));
    saveSetting("pianoClickVolume", String(clickVolume));
    report();
    toast("Click volume " + clickVolume + "%");
    if (audio) click(audio.currentTime, true);
  }

  // Link page (or N): the count-in before a tempo-mode start. The song starts over so it applies.
  function setCountIn(id) {
    if (mode !== "play") return;
    countInOn = id === "on" ? true : id === "off" ? false : !countInOn;
    saveSetting("pianoCountIn", countInOn ? "on" : "off");
    if (tempo) newSession(); else report();
    toast(countInOn ? "Count-in on" : "Count-in off");
  }

  // Link page (or U): the speed ramp. Looping a bar in tempo mode, each clean pass raises the speed.
  function setRamp(id) {
    if (mode !== "play") return;
    ramp = id === "on" ? true : id === "off" ? false : !ramp;
    saveSetting("pianoRamp", ramp ? "on" : "off");
    if (tempo && loop) newSession(); else { if (session) modeText(); report(); }
    toast(ramp ? "Speed ramp on · " + speed + "% → " + rampTarget + "%" + (tempo && loop ? "" : " (tempo mode, loop a bar)") : "Speed ramp off");
  }

  // Link page slider: the speed the ramp climbs to. The running loop carries on.
  function setRampTarget(v) {
    if (mode !== "play") return;
    rampTarget = P.clampSpeed(v);
    saveSetting("pianoRampTarget", String(rampTarget));
    if (session) { modeText(); lastSide = ""; }
    report();
    toast("Ramp target " + rampTarget + "%");
  }

  // The audio context for the clicks, made on first need. A key press is a user gesture, so the
  // keydown handler calls this too and the browser lets the sound start.
  function audioWake() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!audio && AC) { try { audio = new AC(); } catch (e) {} }
    if (audio && audio.state === "suspended") { try { audio.resume(); } catch (e) {} }
    return audio;
  }

  // One click at audio time when: a short blip, higher on the accented first beat of a bar.
  function click(when, accent) {
    if (!audioWake() || clickVolume <= 0) return;
    var o = audio.createOscillator(), g = audio.createGain();
    var peak = clickVolume / 100 * (accent ? 1 : 0.55);
    o.frequency.value = accent ? 1500 : 1000;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), when + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.06);
    o.connect(g); g.connect(audio.destination);
    o.start(when); o.stop(when + 0.08);
  }

  // Schedule the clicks for the next 100 ms. Frame timing jitters, so a click is not sounded when a
  // frame sees its beat; it is handed to Web Audio ahead of time, which keeps its own steady clock.
  function metronomeTick() {
    var ahead = clock + 100 / session.beatMs;
    var from = clickedTo;
    // The clock jumped (a restart, a new pass, a seek): start from where it is now.
    if (!(from >= clock - 0.5 && from <= ahead)) from = clock - 0.001;
    var beats = P.metronomeBeats(from, ahead, song.beatsPerBar || 4);
    for (var i = 0; i < beats.length; i++) {
      var b = beats[i];
      if (!(clicksOn() || (countInWanted() && b.beat < session.range.start))) continue;
      if (!audioWake()) break;
      click(audio.currentTime + Math.max(0, (b.beat - clock) * session.beatMs / 1000), b.accent);
    }
    clickedTo = ahead;
  }

  function rememberedFingers() {
    try { return localStorage.getItem("pianoFingers") !== "off"; } catch (e) { return true; }
  }

  // Link page toggle (or F): show or hide the finger numbers. id is "on", "off" or "" to toggle.
  function setFingers(id) {
    fingers = id === "on" ? true : id === "off" ? false : !fingers;
    try { localStorage.setItem("pianoFingers", fingers ? "on" : "off"); } catch (e) {}
    toast(fingers ? "Finger numbers on" : "Finger numbers off");
    report();
  }

  function rememberedView() {
    var v = "";
    try { v = localStorage.getItem("pianoView") || ""; } catch (e) {}
    return VIEW_NAMES[v] ? v : "both";
  }

  // Link page (or V): falling notes only, sheet music and falling notes, or sheet music only.
  // id is "notes", "both", "sheet" or "" for the next one.
  function setView(id) {
    view = VIEW_NAMES[id] ? id : S.nextView(view);
    try { localStorage.setItem("pianoView", view); } catch (e) {}
    toast(VIEW_NAMES[view]);
    report();
  }

  // Hear it first (remote ⏪, P, or the link page): the keyboard plays the bar being practised, or the
  // whole loop, at the song's tempo for the hand being practised. The TV runs the notes down and
  // lights each key as it sounds, then puts the song back where it was waiting. Pressing it again stops.
  function toggleListen() {
    if (mode !== "play" || !session || !song) return;
    if (listen || pendingListen()) return stopListen(true);
    listenReq = null;
    var bars = P.barCount(song);
    var from = loop ? loop.from : Math.min(bars, P.barOf(song, playingAt())), to = loop ? loop.to : from;
    var plan = P.listenPlan(song, { hand: session.hand, from: from, to: to, speed: tempo ? speed : 100 });
    if (!plan.events.length) { toast("Nothing to hear in " + barsText(plan)); return; }
    var req = listenReq = { at: Date.now() };
    var events = plan.events.map(function (e) { return { note: e.note, at: e.at, dur: e.dur }; });
    postJson("/api/piano/listen", { events: events }, function (err, r) {
      if (req !== listenReq) return;
      listenReq = null;
      beginListen(plan, barsText(plan), false, null, err, r);
    });
  }

  // The request for Hear it first that is still on its way, if it was sent recently enough to be waited for.
  function pendingListen() { return P.listenPending(listenReq, Date.now(), PENDING_MS) ? listenReq : null; }

  // The TV side of Hear it first once the keyboard has been told: the badge, the clock and the lit keys.
  function beginListen(plan, label, whole, player, err, r) {
    listen = { plan: plan, t0: Date.now() + P.LISTEN_LEAD_MS, clock: clock, paused: paused, label: label, whole: whole, player: player, shownBar: 0 };
    held = {};
    var sub = err ? "Server unreachable: lights only" : !(r && r.link) ? "No link page is open: lights only" : !(r && r.output) ? "No keyboard output on the link page: lights only" : whole ? "press the key again, or play any key, to stop" : "then it is your turn";
    $("toast").className = "";
    $("listen").innerHTML = whole
      ? "♪ Playing the whole song · " + HAND_NAMES[plan.hand].toLowerCase() + '<span class="sub" id="wholeBar"></span><div class="meter"><i id="wholeFill"></i></div><span class="sub">' + esc(sub) + "</span>"
      : "♪ Listen · " + esc(label) + " · " + HAND_NAMES[plan.hand].toLowerCase() + '<span class="sub">' + esc(sub) + "</span>";
    $("listen").className = whole ? "on whole" : "on";
    wholeNote = whole && sub.indexOf("lights only") >= 0 ? sub : "";
    lastSide = "";
    report();
  }

  // Hear the whole song (remote: hold ⏪, W on a keyboard, or the link page's button): the keyboard plays
  // the song from the first bar to the end, for the hand being practised, at the song's tempo (at the
  // speed setting in tempo mode). The link page gets it a few seconds at a time. Again, any key played on
  // the keyboard, or leaving the song stops it.
  function toggleWhole() {
    if (listen || pendingListen()) return stopListen(true);
    listenReq = null;
    startWhole();
  }

  function startWhole() {
    var why = P.wholeBlocker(mode, !!(session && song));
    if (why) { wholeNote = why; toast(why); report(); return; }
    var plan = P.wholeSongPlan(song, { hand: session.hand, speed: tempo ? speed : 100 });
    if (!plan.events.length) { wholeNote = "Nothing to hear in this song"; toast(wholeNote); report(); return; }
    // A bar already playing is handed over: the first chunk replaces whatever the keyboard is still playing.
    if (listen || listenReq) stopListen(false);
    wholeNote = "";
    toast("Starting the whole song…");
    var req = listenReq = { whole: true, at: Date.now() }, first = true;
    var player = req.player = P.songPlayer(plan, {
      now: Date.now, setTimer: function (fn, ms) { return setTimeout(fn, ms); }, clearTimer: function (id) { clearTimeout(id); },
      send: function (chunk, done) {
        postJson("/api/piano/listen", { whole: true, first: chunk.first, last: chunk.last, base: chunk.base, span: chunk.span, events: chunk.events }, function (err, r) {
          if (first) {
            first = false;
            if (!err && req === listenReq && !player.ended()) { listenReq = null; beginListen(plan, "the whole song", true, player, err, r); }
            else if (err) wholeNote = "Could not start the whole song: " + (err === "network" ? "the server cannot be reached" : err);
          }
          done(err);
        });
      },
      sendStop: function () { postJson("/api/piano/listen", { stop: true }, function () {}); },
      onEnd: function (reason) {
        if (reason !== "lost") return;
        // The server can no longer be reached: the song ends here, on the TV as well.
        var started = listen && listen.player === player;
        if (listenReq === req) listenReq = null;
        if (started) stopListen(false);
        if (!started) toast(wholeNote || "Could not start the whole song");
        else { wholeNote = "Lost the connection: the song stopped"; toast(wholeNote); }
        report();
      },
    });
    report();
    player.start(Date.now() + P.LISTEN_LEAD_MS);
  }

  // The whole song's progress bar and the bar it is in, on the badge.
  function wholeProgress(frac) {
    var fill = $("wholeFill"), txt = $("wholeBar");
    if (!fill || !txt) return;
    fill.style.width = (Math.min(1, frac) * 100).toFixed(1) + "%";
    var bars = P.barCount(song), bar = Math.min(bars, Math.max(1, P.barOf(song, clock)));
    if (bar !== listen.shownBar) { listen.shownBar = bar; txt.textContent = "Bar " + bar + " of " + bars; }
  }

  // Ends Hear it first: tell is true when the keyboard must stop too (stopped early, song changed).
  function stopListen(tell) {
    var pl = (listen && listen.player) || (listenReq && listenReq.player);
    if (pl) pl.stop(tell);
    else if (tell && (listen || listenReq)) postJson("/api/piano/listen", { stop: true }, function () {});
    listenReq = null;
    if (!listen) return;
    if (session.tempo) {
      // Tempo mode plays the bars just heard: count in again before them, nothing judged from there on.
      var from = listen.whole ? session.range.start : listen.plan.startBeat;
      session.seek(from);
      for (var mk in marks) if (Number(mk) >= from - 1e-6) delete marks[mk];
      clock = from - session.range.countIn;
    } else clock = listen.clock;
    paused = listen.paused; listen = null;
    echoUntil = Date.now() + ECHO_MS;
    $("listen").className = "";
    lastSide = "";
    report();
  }

  function cancelListen() { if (listen || listenReq) stopListen(true); }

  function rememberedHand() {
    var h = "";
    try { h = localStorage.getItem("pianoHand") || ""; } catch (e) {}
    return HAND_NAMES[h] ? h : "right";
  }

  // Remote ▲ and the link page: right, left or both hands.
  function setHand(h) {
    if (mode !== "play" || !HAND_NAMES[h]) return;
    hand = h;
    try { localStorage.setItem("pianoHand", hand); } catch (e) {}
    newSession();
    if (song && session.hand !== hand) toast(song.title + " has the " + song.hands[0] + " hand only");
    else toast(HAND_NAMES[hand]);
  }

  // Practice loop over bars from..to; null stops it. The song starts again either way.
  function setLoop(l) {
    if (mode !== "play" || !song) return;
    loop = l && l.from ? l : null;
    newSession();
    toast(loop ? "Loop " + barsText(loop) + " · " + session.cleanNeeded + " clean in a row" : "Loop off");
  }

  function barsText(l) { return l.from === l.to ? "bar " + l.from : "bars " + l.from + "–" + l.to; }

  // Remote ⏯ (or L): loop the bar being played, or stop looping.
  function toggleLoop() {
    if (!session) return;
    if (loop) return setLoop(null);
    setLoop({ from: P.barOf(song, playingAt()), to: P.barOf(song, playingAt()) });
  }

  // The beat being played: wait mode's step, or tempo mode's clock once the count-in is over.
  function playingAt() {
    if (session.tempo) return Math.max(clock, session.range.start);
    var st = session.current();
    return st ? st.start : clock;
  }

  // Remote ◀ ▶ while looping: move the loop by a bar, keeping its length.
  function moveLoop(dir) {
    if (!loop) return;
    var len = loop.to - loop.from, bars = P.barCount(song);
    var from = Math.max(1, Math.min(bars - len, loop.from + dir));
    if (from !== loop.from) setLoop({ from: from, to: from + len });
  }

  // Which song plays: the one asked for (remote or link page), else ?song=, else the last one
  // played on this TV, else the first song in songs/.
  function remembered() { try { return localStorage.getItem("pianoSong") || ""; } catch (e) { return ""; } }
  function loadSong(id) {
    var want = /[?&]song=([^&]+)/.exec(location.search);
    getJson("/api/piano/songs", function (err, list) {
      if (err) { $("title").textContent = "Songs unavailable"; return setTimeout(function () { loadSong(id); }, 10000); }
      songs = list.songs;
      var ok = songs.filter(function (s) { return !s.error; });
      function find(x) { return x && ok.filter(function (s) { return s.id === x; })[0]; }
      var pick = find(id) || find(want && decodeURIComponent(want[1])) || find(remembered()) || ok[0];
      if (!pick) { $("title").textContent = "No songs in songs/"; return; }
      getJson("/api/piano/songs/" + encodeURIComponent(pick.id), function (err2, s) {
        if (err2) { $("title").textContent = "Song failed to load"; return setTimeout(function () { loadSong(id); }, 10000); }
        songId = pick.id;
        try { localStorage.setItem("pianoSong", songId); } catch (e) {}
        rawSong = s; song = null; session = null; held = {}; loop = null;
        fitSong();
        var sc = scoreOf(songId);
        if (id) toast(s.title + (sc && sc.fullPlays ? " · best " + P.percentText(sc.bestAccuracy) + (sc.mastered ? " ★" : "") : ""));
      });
    });
  }

  // Remote Left / Right (and the link page) pick the previous / next song.
  function stepSong(dir) {
    if (mode !== "play" || !songs.length) return;
    // Stepping past either end of the song list opens the tutorial, between the last song and the first.
    var ok = songs.filter(function (s) { return !s.error; }), at = -1;
    ok.forEach(function (s, i) { if (s.id === songId) at = i; });
    if (ok.length && at >= 0 && (dir > 0 ? at === ok.length - 1 : at === 0)) return openTutor(dir > 0 ? { left: songId, right: ok[0].id } : { left: ok[ok.length - 1].id, right: songId });
    loadSong(P.stepSong(songs, songId, dir));
  }

  var toastTimer = null;
  function toast(text) {
    var el = $("toast");
    el.textContent = text; el.className = "on";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ""; }, 1800);
  }

  // The wall is another server's page: its address comes from the server's wallUrl ("" when none is set).
  var wallUrl = "";
  var leaving = false;
  function toWall() {
    if (leaving) return;
    if (!wallUrl) { toast("No wall page set (wallUrl in config.json)"); return; }
    cancelListen();
    leaving = true;
    toast("Switching to wall…");
    setTimeout(function () { location.href = wallUrl; }, 150);
  }

  function restart() {
    if (!session) return;
    cancelListen();
    session.restart(); startClock(); paused = false; held = {}; playStart = 0; lastResult = null; marks = {};
    panel();
    report();
  }

  // ---------- input ----------

  function noteOn(n) {
    // What Hear it first plays (and any echo of it) is not the player's input.
    if (mode === "play" && tutor) return tutorNote(n);
    if (mode === "play" && (listen || listenReq || Date.now() < echoUntil)) {
      // A key played while the whole song sounds stops it (the link page already drops the keyboard's echo of it).
      if ((listen && listen.whole) || (listenReq && listenReq.whole)) stopListen(true);
      return;
    }
    held[n] = true;
    if (mode === "cal1") { work.low = n; calNote(); return; }
    if (mode === "cal2") { work.high = n; calNote(); return; }
    if (mode === "cal3" || !session) return;
    if (progressOn) return;
    if (session.done) { restart(); held[n] = true; }
    if (session.tempo && paused) return;
    // Settle the misses up to now first, so the hint for a wrong key points at a note still to come.
    if (session.tempo) tempoTick(Date.now());
    if (!playStart) playStart = Date.now();
    var st = session.current(), r = session.tempo ? session.press(n, clock) : session.press(n);
    // The sheet music colours each step played: green, or red when it took a wrong key.
    if (r.result === "wrong" && st) marks[st.start] = "bad";
    else if (r.result === "advance" || r.result === "pass" || r.result === "done") marks[st.start] = marks[st.start] || "ok";
    else if (r.result === "hit") tempoMarks();
    if (r.result === "hit") {
      // Tempo mode: green on time, amber early or late.
      flash[n] = { color: r.timing === "on time" ? "#3ddc84" : "#ffb020", until: Date.now() + FLASH_MS };
      $("hint").className = ""; hintUntil = 0;
    } else if (r.result === "wrong") {
      // A wrong key stays red while it is held down, then fades.
      flash[n] = { color: "#ff5252", until: Infinity };
      $("hint").textContent = r.hint; $("hint").className = "on"; hintUntil = Date.now() + HINT_MS;
    } else if (r.result !== "ignored") {
      flash[n] = { color: "#3ddc84", until: Date.now() + FLASH_MS };
      $("hint").className = ""; hintUntil = 0;
    }
    if (r.result === "pass") {
      // One time through the loop: say whether it was clean and start the bars again.
      toast(r.clean ? "Clean! " + session.cleanPasses + " of " + session.cleanNeeded : "Not clean · again, 0 of " + session.cleanNeeded);
      clock = session.range.start - LEAD_IN / 2;
      marks = {};
    }
    if (r.result === "done") { panel(); saveResult(); }
    report();
  }

  // ---------- score history ----------

  function scoreOf(id) {
    for (var i = 0; i < songs.length; i++) if (songs[i].id === id) return songs[i].score || null;
    return null;
  }

  // Best score of the song on the left, under its title.
  function showBest() {
    var sc = song && scoreOf(songId), el = $("best");
    el.innerHTML = sc && sc.fullPlays ? "Best " + P.percentText(sc.bestAccuracy) + " · streak " + sc.bestStreak + (sc.mastered ? ' · <b>★ mastered</b>' : "") : "";
  }

  // A finished play goes to the server, which keeps the history; the reply says whether it was a new best.
  function saveResult() {
    var rec = P.playRecord(song, session, { mode: playMode, speed: playSpeed, durationMs: Date.now() - (playStart || Date.now()) });
    rec.song = songId;
    var s = session;
    postJson("/api/piano/history", rec, function (err, r) {
      if (err || !r) { lastResult = { error: err || "no reply" }; }
      else {
        lastResult = r;
        for (var i = 0; i < songs.length; i++) if (songs[i].id === rec.song) songs[i].score = r.score;
        history = null;
      }
      if (session === s && s.done) { panel(); showBest(); }
    });
  }

  function toggleProgress(on) {
    progressOn = on == null ? !progressOn : on;
    if (!progressOn) { $("progress").className = ""; return; }
    renderProgress();
    getJson("/api/piano/history?limit=8", function (err, h) {
      if (err) return;
      history = h;
      if (progressOn) renderProgress();
    });
  }

  function dateText(at) {
    var d = new Date(at);
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }

  function renderProgress() {
    var scores = history ? history.scores : {}, rows = "";
    songs.forEach(function (sg) {
      if (sg.error) return;
      var sc = scores[sg.id] || sg.score;
      rows += "<tr><td class=" + (sg.id === songId ? "cur" : "") + ">" + esc(sg.title || sg.id) + "</td>" +
        "<td>" + (sc && sc.fullPlays ? P.percentText(sc.bestAccuracy) : "-") + "</td>" +
        "<td>" + (sc && sc.bestTiming != null ? P.percentText(sc.bestTiming) : "-") + "</td>" +
        "<td>" + (sc && sc.fullPlays ? sc.bestStreak : "-") + "</td>" +
        "<td>" + (sc ? sc.plays : 0) + "</td>" +
        "<td>" + (sc && sc.mastered ? '<span class=badge>★ Mastered</span>' : sc && sc.bestBothAccuracy != null ? "Both hands " + P.percentText(sc.bestBothAccuracy) : sc && sc.fullPlays ? "Try both hands" : "") + "</td></tr>";
    });
    var recent = "";
    if (history && history.plays.length) {
      recent = "<div class=recent><b>Recent</b><br>" + history.plays.slice(0, 5).map(function (p) {
        return esc(p.title || p.song) + " · " + p.hand + " hand" + (p.hand === "both" ? "s" : "") + " · " + p.mode + (p.loop ? " · " + esc(barsText(p.loop)) : "") + " · " + P.percentText(p.accuracy) + (p.timing ? " · timing " + P.timingText(p.timing) : "") + " · " + dateText(p.at);
      }).join("<br>") + "</div>";
    }
    $("progress").innerHTML = "<h1>Progress</h1><div class=sub>Mastered: the whole song in both hands at " + P.MASTER_ACCURACY + "% or better. Timing: notes within " + P.TEMPO_ON_MS + " ms of the beat, tempo mode only. <b>OK</b> or <b>Back</b> closes.</div>" +
      "<table><tr><th>Song</th><th>Best</th><th>Timing</th><th>Streak</th><th>Plays</th><th></th></tr>" + rows + "</table>" + recent;
    $("progress").className = "on";
  }

  function noteOff(n) {
    delete held[n];
    if (flash[n] && flash[n].until === Infinity) flash[n].until = Date.now() + FLASH_MS / 2;
  }

  function calNote() {
    // Keep the range sane while someone is still finding the end keys.
    if (work.high - work.low < 12) { if (mode === "cal1") work.high = work.low + 60; else work.low = work.high - 60; }
    calWarn = "";
    if (mode === "cal1" && work.low % 12 !== 0) calWarn = "Lowest key read as " + P.noteName(work.low) + ", not a C: switch off Transpose on the Casio, then press it again.";
    if (mode === "cal2" && work.high % 12 !== 0) calWarn = "Highest key read as " + P.noteName(work.high) + ", not a C: switch off Transpose on the Casio, then press it again.";
    if (work.low < 0) work.low = 0;
    if (work.high > 127) work.high = 127;
    setLayout(work); panel();
  }

  function startCalibration() {
    cancelListen();
    work = { low: cal.low, high: cal.high, left: cal.left, right: cal.right, screenPx: W, mode: "seat" };
    mode = "cal1"; calWarn = ""; held = {};
    setLayout(work); panel(); report();
  }

  function nudge(px) {
    if (mode === "cal1") work.left = Math.min(work.right - 100, work.left + px);
    else if (mode === "cal2") work.right = Math.max(work.left + 100, work.right + px);
    else return;
    setLayout(work); panel();
  }

  function ok() {
    if (progressOn) toggleProgress(false);
    else if (mode === "cal1") { mode = "cal2"; calWarn = ""; panel(); }
    else if (mode === "cal2") { mode = "cal3"; calWarn = ""; panel(); }
    else if (mode === "cal3") save();
    else if (session && session.done) restart();
    else paused = !paused;
    report();
  }

  function back() {
    if (progressOn) toggleProgress(false);
    else if (mode === "cal3") { mode = "cal2"; panel(); }
    else if (mode === "cal2") { mode = "cal1"; panel(); }
    else if (mode === "cal1") { mode = "play"; setLayout(cal); panel(); }
    report();
  }

  function save() {
    postJson("/api/piano/calibration", work, function (err, c) {
      if (err) { calWarn = "Could not save: " + err; panel(); return; }
      saved = c; mode = "play"; panel(); applyCalibration(); report();
    });
  }

  function control(c) {
    if (c.cmd === "learn") return tutor ? (c.id === "on" ? null : closeTutor()) : (c.id === "off" ? null : openTutor());
    if (tutor) return tutorControl(c);
    if (c.cmd === "calibrate") startCalibration();
    else if (c.cmd === "nudge") nudge(c.px || 0);
    else if (c.cmd === "ok") ok();
    else if (c.cmd === "back") back();
    else if (c.cmd === "restart") { if (mode !== "play") { mode = "play"; setLayout(cal); } restart(); }
    else if (c.cmd === "pause" && mode === "play") { paused = !paused; report(); }
    else if (c.cmd === "song") { if (mode === "play" && c.id) loadSong(c.id); }
    else if (c.cmd === "hand") setHand(c.id);
    else if (c.cmd === "loop") setLoop(c.from ? { from: c.from, to: c.to || c.from } : null);
    else if (c.cmd === "listen") toggleListen();
    else if (c.cmd === "listenAll") toggleWhole();
    else if (c.cmd === "fingers") setFingers(c.id);
    else if (c.cmd === "progress") { if (mode === "play") toggleProgress(c.id === "off" ? false : c.id === "on" ? true : null); }
    else if (c.cmd === "view") setView(c.id);
    else if (c.cmd === "tempo") setTempo(c.id);
    else if (c.cmd === "speed") setSpeed(c.id);
    else if (c.cmd === "metronome") setMetronome(c.id);
    else if (c.cmd === "metronomeVolume") setClickVolume(c.id);
    else if (c.cmd === "countin") setCountIn(c.id);
    else if (c.cmd === "ramp") setRamp(c.id);
    else if (c.cmd === "rampTarget") setRampTarget(c.id);
  }

  // Play-pause on the Fire TV remote; L on a keyboard.
  function isLoopKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return false;
    return e.key === "MediaPlayPause" || e.key === "l" || e.key === "L" || ((e.key === undefined || e.key === "Unidentified") && (e.keyCode === 179 || e.keyCode === 85));
  }

  // Remote: while calibrating ◀ ▶ move the edge line 1 device pixel (10 when held or with Shift), OK
  // confirms, Back steps back. In play, ◀ ▶ pick the previous / next song (or move the loop while
  // looping), ▲ (or H) cycles right / left / both hands, ⏯ (or L) loops the current bar or stops the
  // loop, OK pauses (or replays a finished song), ▼ or C calibrates, ⏪ (or P) plays the bar first
  // (Hear it first; pressed twice quickly, or held down, or W, it plays the whole song), ⏩ (or M) switches to the wall, F shows or hides the finger numbers, S opens
  // the progress screen (also the link page's Progress button; OK or Back closes it) V switches
  // between falling notes, sheet music and both, B turns the room light (the bulb) on or off and O changes its palette. On a keyboard only (the remote has no free key), T
  // switches tempo mode and - / = change its speed; K switches the metronome, N the count-in and U the
  // speed ramp.
  document.addEventListener("keydown", function (e) {
    var k = e.key, step = e.repeat || e.shiftKey ? 10 : 1;
    audioWake();
    if (tutor && tutorKey(e)) return;
    if (TVSwitch.isListenKey(e)) {
      e.preventDefault();
      if (!e.repeat) {
        var now = Date.now(), playing = !!(listen || pendingListen());
        var act = P.hearKeyAction({ playing: playing, tapAt: hearTapAt }, now, DOUBLE_PRESS_MS);
        hearTapAt = 0; hearDownAt = 0;

    }
    else if ((k === "w" || k === "W") && mode === "play") { if (!e.repeat) toggleWhole(); }
    else if (TVSwitch.isSwitchKey(e)) { e.preventDefault(); if (!e.repeat) toWall(); }
    else if (isLoopKey(e)) { e.preventDefault(); if (!e.repeat && mode === "play") toggleLoop(); }
    else if (k === "ArrowLeft") { if (mode === "play") { if (!e.repeat) loop ? moveLoop(-1) : stepSong(-1); } else nudge(-step); e.preventDefault(); }
    else if (k === "ArrowRight") { if (mode === "play") { if (!e.repeat) loop ? moveLoop(1) : stepSong(1); } else nudge(step); e.preventDefault(); }
    else if ((k === "ArrowUp" || k === "h" || k === "H") && mode === "play") { if (!e.repeat) setHand(P.nextHand(hand)); e.preventDefault(); }
    else if (k === "Enter" || k === " ") { ok(); e.preventDefault(); }
    else if (k === "Escape" || k === "Backspace" || k === "GoBack" || k === "BrowserBack") { if (mode !== "play" || progressOn) { back(); e.preventDefault(); } }
    else if ((k === "ArrowDown" || k === "c" || k === "C") && mode === "play") { startCalibration(); e.preventDefault(); }
    else if ((k === "e" || k === "E") && mode === "play") { if (!e.repeat) openTutor(); }
    else if ((k === "r" || k === "R") && mode === "play") restart();
    else if ((k === "f" || k === "F") && mode === "play") setFingers("");
    else if ((k === "s" || k === "S" || k === "g" || k === "G") && mode === "play") toggleProgress();
    else if ((k === "v" || k === "V") && mode === "play") setView("");
    else if ((k === "b" || k === "B") && mode === "play") { if (!e.repeat) toggleLight(); }
    else if ((k === "o" || k === "O") && mode === "play") { if (!e.repeat) nextPalette(); }
    else if ((k === "t" || k === "T") && mode === "play") { if (!e.repeat) setTempo(""); }
    else if ((k === "k" || k === "K") && mode === "play") { if (!e.repeat) setMetronome(""); }
    else if ((k === "n" || k === "N") && mode === "play") { if (!e.repeat) setCountIn(""); }
    else if ((k === "u" || k === "U") && mode === "play") { if (!e.repeat) setRamp(""); }
    else if ((k === "-" || k === "_") && mode === "play") setSpeed(speed - P.SPEED_STEP);

  // ---------- tutorial mode ----------
  // Lessons are data (lessons/*.json, listed by /api/piano/lessons); piano-lessons.js runs the steps and
  // judges them with the same wait-mode and tempo-mode sessions as the songs. This page only shows them:
  // the keyboard, the falling notes and the sheet music are the ones the songs use. While it is open
  // `tutor` is set, the song the page had is put away, and keys and notes go to the functions below.

  var TUTOR_SHEET_H = 0.4;  // the sheet music's share of the screen height in a lesson step
  var HEAR_STEP_MS = 650;   // gap between the notes of a hear-it-first on an explain step

  function curView() { return tutor && tutor.runner && tutor.view ? tutor.view : view; }
  function fingersShown() { return tutor && tutor.runner ? !(tutor.runner.rt && tutor.runner.rt.blind) : fingers; }
  function tutorBlind() { return !!(tutor && tutor.runner && tutor.runner.rt && tutor.runner.rt.blind); }
  function clicksOn() { return tutor && tutor.runner ? !!(tutor.runner.rt && tutor.runner.rt.metronome) : metronome; }
  function countInWanted() { return tutor ? true : countInOn; }

  // Bottom edge of the lesson panel in device pixels: falling notes start under it.
  function tutorBottom() {
    if (!tutor || tutor.screen !== "lesson") return 0;
    return Math.round(($("tutor").getBoundingClientRect().bottom + window.innerHeight / 90) * DPR);
  }

  // leave: the songs to go back to with ◀ and ▶ (the neighbours of the tutorial in the song list).
  function openTutor(leave) {
    if (tutor || mode !== "play") return;
    cancelListen();
    tutorStash = { rawSong: rawSong, origin: songId, leave: leave || { left: songId, right: songId } };
    rawSong = null; song = null; session = null; held = {}; flash = {}; marks = {}; paused = false; loop = null;
    tutor = { screen: "menu", lessons: [], progress: PL.emptyProgress(), sel: 0, loading: true, error: "", errors: 0, runner: null, lesson: null, index: 0, view: "", still: false, msg: "", msgKind: "", busy: false };
    document.body.className = "tutor";
    $("hint").className = ""; hintUntil = 0; $("count").className = ""; shownCount = -1;
    tutorRender(); report();
    getJson("/api/piano/lessons", function (err, d) {
      if (!tutor) return;
      tutor.loading = false;
      if (err) { tutor.error = "The lessons could not be loaded (" + err + ")."; return tutorRender(); }
      tutor.lessons = d.lessons.filter(function (l) { return !l.error; });
      tutor.errors = d.lessons.length - tutor.lessons.length;
      tutor.progress = PL.validProgress(d.progress);

    });
  }

  // dir: -1 and 1 go to the song on that side of the tutorial, 0 back to the song it was opened from.
  function closeTutor(dir) {
    if (!tutor) return;
    stopHear(true);
    var st = tutorStash, id = st ? (dir < 0 ? st.leave.left : dir > 0 ? st.leave.right : st.origin) : songId;
    tutor = null; tutorStash = null; tutorHear = null; held = {}; flash = {}; marks = {}; paused = false;
    document.body.className = ""; $("tutor").innerHTML = ""; $("count").className = ""; shownCount = -1;
    session = null; song = null;
    rawSong = st ? st.rawSong : null;
    if (id && id !== songId) loadSong(id); else if (rawSong) fitSong(); else loadSong(songId);
    lastPlace = ""; panel(); report();
  }

  function tutorMenu() {
    stopHear(true);
    tutor.screen = "menu"; tutor.runner = null; tutor.lesson = null; tutor.view = ""; tutor.still = false; tutor.msg = "";
    session = null; song = null; paused = false; held = {}; flash = {}; marks = {}; shownCount = -1; $("count").className = "";
    tutorRender(); report();
  }

  function tutorSelect(d) {
    if (!tutor.lessons.length) return;
    tutor.sel = Math.max(0, Math.min(tutor.lessons.length - 1, tutor.sel + d));
    tutorRender();
  }

  // Opens lesson i, at the step the player stopped on (or the first when fresh is true).
  function startLesson(i, fresh) {
    var l = tutor.lessons[i];
    if (!l || tutor.busy) return;
    if (!PL.isUnlocked(tutor.lessons, tutor.progress, i)) { toast("Pass lesson " + i + " first"); return; }
    tutor.busy = true;
    getJson("/api/piano/lessons/" + encodeURIComponent(l.id), function (err, lesson) {
      if (!tutor) return;
      tutor.busy = false;
      if (err) return toast("The lesson could not be loaded");
      tutor.lesson = lesson; tutor.index = i; tutor.screen = "lesson";
      tutor.runner = PL.createRunner(lesson, { low: cal.low, high: cal.high, tolerant: micMode, start: fresh ? 0 : PL.resumeStep(tutor.progress, lesson) });
      tutorSetup();
    });
  }

  // The page for the runner's current step: the song and session it plays, or the staff it shows.
  function tutorSetup() {
    var run = tutor.runner, rt = run.rt;
    stopHear(true);
    held = {}; flash = {}; marks = {}; paused = false; playStart = 0; clickedTo = 0; shownCount = -1; $("count").className = "";
    tutor.msg = ""; tutor.msgKind = ""; tutor.view = ""; tutor.still = false; song = null; session = null;
    if (rt.kind === "sequence") {
      song = rt.song; song.fitLow = cal.low; song.fitHigh = cal.high; session = rt.session; tutor.view = rt.view; startClock();
    } else tutorShow(rt.kind === "quiz" ? rt.display() : rt.display);
    tutorPost({ lesson: tutor.lesson.id, action: "step", step: run.index });
    tutorRender(); report();
  }

  // A one-off staff (a note to read, the notes an explanation points at): sheet music only, nothing moves.
  function tutorShow(d) {
    song = null; session = null; tutor.view = ""; tutor.still = false;
    if (!d) return;
    song = P.fitSong(d.song, cal.low, cal.high); song.fitLow = cal.low; song.fitHigh = cal.high;
    session = P.createSession(song, { hand: "right" }); session.done = true;
    paused = true; tutor.view = d.view; tutor.still = true; startClock();
  }

  function tutorPost(body) {
    var now = Date.now(), p = tutor.progress;
    tutor.progress = body.action === "pass" ? PL.recordPass(p, body.lesson, body.score, now) : body.action === "attempt" ? PL.recordAttempt(p, body.lesson, body.score, now) : PL.recordStep(p, body.lesson, body.step, now);

    });
  }

  // The step is finished: record a check, then show how it went.
  function tutorDone() {
    var run = tutor.runner, o = run.outcome;

      var later = tutor.lesson.steps.slice(run.index + 1).some(function (s) { return s.type === "check"; });
      if (!o.passed) tutorPost({ lesson: tutor.lesson.id, action: "attempt", score: o.score });

    }
    tutor.msg = ""; tutorRender(); report();
  }

  function tutorLessonDone() {
    var i = tutor.index, passed = PL.lessonState(tutor.progress, tutor.lesson.id).status === "passed", n = Math.min(i + 1, tutor.lessons.length - 1);
    tutorMenu();

    tutorRender();
  }

  }

  function tutorOk() {
    var run = tutor.runner, o = run.outcome;

  // Remote and keyboard. Returns true when the key was used; the ones left out (Fast-Forward, B and O for

  function tutorKey(e) {

    if (TVSwitch.isSwitchKey(e) || k === "b" || k === "B" || k === "o" || k === "O") return false;
    e.preventDefault();
    if (e.repeat) return true;

    else if (k === "ArrowDown" || back || k === "e" || k === "E") tutorMenu();

  // Commands from the link page while the tutorial is open.

    else if (c.cmd === "listen") { if (tutor.runner) tutorHearToggle(); }
    else if (c.cmd === "ok") { if (tutor.screen === "menu") startLesson(tutor.sel, false); else if (!tutor.busy) tutorOk(); }
    else if (c.cmd === "back") { if (tutor.screen === "menu") closeTutor(0); else tutorMenu(); }

    var st = rt.kind === "sequence" && !rt.tempo ? session.current() : null;

  // ---------- tutorial: hear it first ----------

  }

  // ---------- tutorial: screens ----------

  function tutorHint() {

    var run = tutor.runner, o = run.outcome, rt = run.rt, step = run.step();
    var hear = rt.kind === "explain" ? (rt.hear.length || rt.lit.length) : rt.kind === "sequence" || (rt.kind === "quiz" && rt.question() && rt.question().target.exact != null);
    var h = hear ? " · ⏪ hear it" : "";

    if (rt.kind === "explain") return "▶ next · ◀ back" + h + " · ▼ lessons";
    return "◀ back · ▲ start again" + (rt.tempo ? " · ⏯ pause" : "") + h + (step.type === "check" ? "" : " · ▶ skip") + " · ▼ lessons";
  }

  function tutorConn() {
    if (!presence) return "";
    if (presence.input === "mic") return presence.device ? "Microphone is listening." : "Microphone is not listening: press Start listening on the link page.";
    if (presence.device) return "Keyboard: " + presence.device;
    return "No keyboard found: open the link page on the computer it is plugged into.";
  }

  function tutorRender() {

    el.innerHTML = tutor.screen === "menu" ? tutorMenuHtml() : tutorLessonHtml();
  }

  function tutorMenuHtml() {
    var ls = tutor.lessons, pr = tutor.progress;
    var h = '<div class="tag">Learn piano</div><h1>Start from the very first step</h1>';
    if (tutor.loading) return h + '<div class="text">Loading the lessons…</div>';
    if (tutor.error) return h + '<div class="msg bad">' + esc(tutor.error) + '</div><div class="keys">◀ ▶ back to the songs</div>';
    var next = PL.nextLesson(ls, pr);
    h += '<div class="prog">' + esc(PL.progressText(ls, pr)) + "</div>";
    h += '<div class="strip">' + PL.strip(ls, pr).map(function (c, i) { return '<span class="' + c.status + '">' + (i + 1) + "</span>"; }).join("") + "</div>";
    h += '<ol class="list">' + ls.map(function (l, i) {
      var st = PL.lessonState(pr, l.id), open = PL.isUnlocked(ls, pr, i);
      var label = st.status === "passed" ? "✓ " + P.percentText(Math.round((st.best || 0) * 1000) / 10) : st.status === "in-progress" ? "step " + (st.step + 1) + " of " + l.steps : !open ? "locked" : i === next ? "start here" : "";

        '<span class="goal">' + esc(l.goal) + '</span><span class="st">' + label + "</span></li>";
    }).join("") + "</ol>";
    var conn = tutorConn();
    if (conn || tutor.errors) h += '<div class="prog">' + esc(conn) + (tutor.errors ? " " + tutor.errors + " lesson file(s) have errors: see the server log or run node validate-lessons.js." : "") + "</div>";
    return h + '<div class="keys">' + esc(tutorHint()) + "</div>";
  }

  function tutorLessonHtml() {
    var run = tutor.runner, step = run.step(), rt = run.rt, o = run.outcome;
    var h = '<div class="tag">' + esc("Lesson " + (tutor.index + 1) + " · step " + (run.index + 1) + " of " + run.total) + "</div>";
    if (o) {
      var title = o.isCheck ? (o.passed ? "Passed!" : "Not quite yet") : o.accuracy >= 0.95 ? "Well played!" : "Nice work!";

  // ---------- tutorial: on the keyboard ----------

  // Lit keys for explanations, finger numbers, letters, the black-key groups, and the keys sounding in a hear-it-first.

    var rt = tutor.runner.rt, lit = {}, n, k, explain = rt.kind === "explain";
    if (explain) rt.lit.forEach(function (x) { lit[x] = { color: null, finger: rt.fingers[x] || 0 }; });
    if (tutorHear) { var sd = P.sounding(tutorHear.plan, now - tutorHear.t0); for (n in sd) lit[n] = { color: "#3ddc84", finger: 0 }; }

  // A bracket over each group of two (amber) and three (blue) black keys, with its number.

  // ---------- relay ----------

  function connect() {
    var es = new EventSource("/api/piano/events?role=tv");
    es.onopen = function () { online = true; status(); };
    es.onerror = function () { online = false; status(); };
    es.addEventListener("midi", function (m) {
      var d = JSON.parse(m.data);
      for (var i = 0; i < d.events.length; i++) {
        var ev = d.events[i];
        if (ev.on && ev.velocity > 0) noteOn(ev.note); else noteOff(ev.note);
      }
    });
    es.addEventListener("control", function (m) {
      // A command that fails must say so on screen, not only in a console nobody sees.
      try { control(JSON.parse(m.data)); } catch (err) { toast("Command failed: " + (err && err.message || err)); }
    });
    // The server runs newer code than this page was loaded with (it was updated or restarted): load it again.
    var build = null;
    es.addEventListener("build", function (m) {
      var id = JSON.parse(m.data).id;
      if (build && build !== id) location.reload();
      build = id;
    });
    es.addEventListener("switch", function (m) {
      try { if (TVSwitch.shouldMove(JSON.parse(m.data).to, "piano")) toWall(); } catch (e) {}
    });
    es.addEventListener("calibration", function (m) {
      var c = JSON.parse(m.data);
      if (c && (!saved || c.savedAt !== saved.savedAt)) { saved = c; if (mode === "play") applyCalibration(); }
      if (!c && !saved && mode === "play" && !connect.asked) { connect.asked = true; startCalibration(); }
    });
    es.addEventListener("light", function (m) { light = JSON.parse(m.data); status(); });
    es.addEventListener("presence", function (m) { presence = JSON.parse(m.data); setMicMode(presence.input === "mic"); status(); });
    // The songs folder changed: a new song joins the ◀ ▶ list, and the song on screen loads again
    // when its file (or its import settings) changed.
    es.addEventListener("songs", function (m) {
      var d = JSON.parse(m.data);
      songs = d.songs;
      if (tutor) return;
      if (!rawSong || (mode === "play" && d.changed.indexOf(songId) >= 0)) loadSong(songId);
    });
  }

  // The room light's switch: a small line in the status block, flipped by a click or the B key.
  function lightText() {
    if (!light) return "";
    if (light.status === "no-bulb") return "Light <b class=bad>no bulb configured</b>";
    var st = { off: "off", searching: "looking for the bulb…", "not-found": "<b class=bad>bulb not found</b>", ready: "<b class=ok>on</b>", active: "<b class=ok>on</b>" }[light.status];
    return '<span id="lightSw" role="switch" aria-checked="' + light.enabled + '" style="cursor:pointer">Light ' + (light.enabled ? (light.status === "ready" || light.status === "active" ? st : "on, " + st) : "off") + " <small>(B)</small></span>" +
      (light.enabled ? ' · <span id="lightPal" style="cursor:pointer">' + palName(light.palette) + " <small>(O)</small></span>" : "");
  }
  function palName(n) { return n ? n.charAt(0).toUpperCase() + n.slice(1) : ""; }
  function toggleLight() { postLight({ enabled: !light.enabled }); }
  // Next palette (O): Spectrum, Aurora, Sunset, Ocean, Warm, and round again.
  function nextPalette() { if (light && light.palettes) postLight({ palette: light.palettes[(light.palettes.indexOf(light.palette) + 1) % light.palettes.length] }); }
  function postLight(body) {
    if (!light || light.status === "no-bulb") return;
    fetch("/api/piano/light", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).then(function (d) { if (d && d.status) { light = d; status(); } }).catch(function () {});
  }
  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    if (e.target.closest("#lightSw")) toggleLight(); else if (e.target.closest("#lightPal")) nextPalette();
  });

  function status() {
    var s = [];
    s.push(online ? "Server <b class=ok>connected</b>" : "Server <b class=bad>reconnecting…</b>");
    if (presence) {
      if (presence.input === "mic") s.push(presence.device ? esc(presence.device.replace(/^Microphone: /, "Mic ")) + " <b class=ok>listening</b>" : "Mic <b class=bad>not listening</b>: press Start listening on the link page");
      else if (presence.device) s.push("Keyboard <b class=ok>" + esc(presence.device) + "</b>");
      else if (presence.link) s.push("Keyboard <b class=bad>not found</b>: plug the keyboard into the computer running the link page");
      else s.push("Keyboard <b class=bad>no link page</b>: open localhost:" + (location.port || 4420) + "/piano/link in Chrome on the computer the keyboard is plugged into");
    }
    var l = lightText();
    if (l) s.push(l);
    s.push(saved ? "Calibrated " + new Date(saved.savedAt).toLocaleDateString() : "Not calibrated: ▼ to calibrate");
    $("status").innerHTML = s.join("<br>");
    if (tutor && tutor.screen === "menu") tutorRender();
  }

  var reportTimer = null;
  // Mirror the play state to the link page (throttled).
  function report() {
    if (reportTimer) return;
    reportTimer = setTimeout(function () {
      reportTimer = null;
      var st = snapshot();
      postJson("/api/piano/state", st, function () {});
    }, 150);
  }

  function snapshot() {
    return {
      mode: mode, paused: paused,
      songId: songId, song: song ? song.title : "", step: !session ? 0 : session.tempo ? Object.keys(session.judged).length : session.index, steps: !session ? 0 : session.tempo ? session.noteCount : session.steps.length,
      hand: hand, playHand: session ? session.hand : hand, songHands: song ? song.hands : [], bars: song ? P.barCount(song) : 0,
      loop: loop, cleanPasses: session ? session.cleanPasses : 0, cleanNeeded: session ? session.cleanNeeded : P.LOOP_CLEAN, passes: session ? session.passes : 0,
      done: session ? session.done : false,
      learn: tutor ? tutor.screen : "", listening: listen ? listen.label : "", listeningAll: !!((listen && listen.whole) || (pendingListen() && listenReq.whole)), wholeNote: wholeNote, fingers: fingers, progress: progressOn, playMode: playMode, view: view, micMode: micMode,
      metronome: metronome, clickVolume: clickVolume, countInOn: countInOn, ramp: ramp, rampTarget: rampTarget, rampSpeed: session && session.tempo ? session.speed : speed,
      tempo: tempo, speed: speed, countIn: session && session.tempo ? P.countIn(clock, session.range.start, session.range.countIn) : 0,
      missed: session && session.tempo ? session.missed : 0, early: session && session.tempo ? session.early : 0,
      late: session && session.tempo ? session.late : 0, onTime: session && session.tempo ? session.onTime : 0,
      waitingFor: session ? session.waitingFor().map(P.noteName) : [],

      correct: session ? session.correct : 0, wrong: session ? session.wrong : 0,

  }
  window.pianoState = snapshot;

  // ---------- panel text ----------

  function panel() {
    if (tutor) { $("panel").className = ""; return status(); }
    var p = $("panel"), h = "";
    if (mode === "cal1") h = "<div class=step>Calibrate · step 1 of 3</div><h1>Press your lowest key</h1>" +
      "<p>Then use <b>◀ ▶</b> until the <b>left blue line</b> sits on the left edge of that key, as seen from the stool. <b>OK</b> when it lines up.</p>" +
      "<p>Lowest key: <b>" + P.noteName(work.low) + "</b> · line at " + Math.round(work.left) + " px</p>";
    else if (mode === "cal2") h = "<div class=step>Calibrate · step 2 of 3</div><h1>Press your highest key</h1>" +
      "<p>Then use <b>◀ ▶</b> until the <b>right blue line</b> sits on the right edge of that key. <b>OK</b> when it lines up.</p>" +
      "<p>Range: <b>" + P.noteName(work.low) + "–" + P.noteName(work.high) + "</b> (" + (work.high - work.low + 1) + " keys) · line at " + Math.round(work.right) + " px</p>";
    else if (mode === "cal3") h = "<div class=step>Calibrate · step 3 of 3</div><h1>Play a few keys anywhere</h1>" +
      "<p>Each key lights a beam straight above itself. If the beams line up, press <b>OK</b> to save. <b>Back</b> redoes the edges.</p>";
    else if (session && session.done) h = resultCard();
    if (calWarn) h += "<p class=warn>" + esc(calWarn) + "</p>";
    p.innerHTML = h; p.className = h ? "on" : "";

  }

  // The card shown when a song or loop is finished: this play's numbers next to the best so far.
  function resultCard() {
    var acc = Math.round(session.accuracy() * 1000) / 10, r = lastResult, p = r && r.play, prev = r && r.previous, sc = r && r.score;
    var head = loop ? "Loop finished" : "Finished", title = loop ? esc(barsText(loop).replace(/^b/, "B")) + " clean " + session.cleanNeeded + " times in a row!" : "Well played!";
    var lines = ["Accuracy <b>" + P.percentText(acc) + "</b> · best streak <b>" + session.bestStreak + "</b> · wrong keys <b>" + session.wrong + "</b>" +
      (p ? " · time <b>" + P.durationText(p.durationMs) + "</b>" : "") + (loop ? " · " + session.passes + " passes" : "")];
    var missed = Object.keys(session.wrongKeys).sort(function (a, b) { return session.wrongKeys[b] - session.wrongKeys[a] || a - b; }).slice(0, 3);
    if (session.tempo) lines.push("Tempo <b>" + session.speed + "%</b> · " + session.onTime + " on time, " + session.early + " early, " + session.late + " late, <b>" + session.missed + " missed</b>");
    if (session.tempo) {

    if (missed.length) lines.push("Most missed: " + missed.map(function (n) { return "<b>" + P.noteName(Number(n)) + "</b> ×" + session.wrongKeys[n]; }).join(", "));

    else if (p && loop) lines.push("Loop plays are saved but do not count towards best scores.");
    else if (p && sc) {
      var best = prev && prev.bestAccuracy != null ? prev.bestAccuracy : null;
      lines.push((best == null ? '<span class=gold>First score for this song.</span> ' : acc > best ? '<span class=gold>New best accuracy!</span> Before: ' + P.percentText(best) + ". " : "Best " + P.percentText(sc.bestAccuracy) + ". ") +
        (sc.mastered && !(prev && prev.mastered) ? '<span class=gold>★ Mastered!</span>' : sc.mastered ? "★ Mastered." : p.hand !== "both" ? "Play both hands at " + P.MASTER_ACCURACY + "% to master it." : acc < P.MASTER_ACCURACY ? P.MASTER_ACCURACY + "% in both hands masters it." : ""));
    }

  }

  // ---------- drawing ----------

  function frame(t) {
    var now = Date.now(), dt = Math.min(100, t - (frame.last || t));
    frame.last = t;
    if (tutor) {
      tutorFrame(dt, now);
    } else if (listen) {
      // Hear it first runs the clock through the bars at tempo, whatever wait mode is waiting for.
      var el = now - listen.t0;
      if (el >= listen.plan.ms) stopListen(false);
      else {
        clock = listen.plan.startBeat + el / listen.plan.beatMs;
        if (listen.whole) wholeProgress(Math.max(0, el) / listen.plan.ms);
      }
    } else if (session && mode === "play" && !paused && !progressOn && session.tempo) {
      // Tempo mode: the clock keeps time at the chosen speed and notes not struck in time are missed.
      clock = P.advanceClock(clock, dt, song.bpm * session.speed / 100, null);
      tempoTick(now);
      metronomeTick();
    } else if (session && mode === "play" && !paused) {
      // A finished song keeps falling away instead of freezing on screen.
      var st = session.current();
      clock = P.advanceClock(clock, dt, song.bpm, st ? st.start : null);
    }
    countShow();
    if (hintUntil && now > hintUntil) { $("hint").className = ""; hintUntil = 0; }
    place();
    draw(now);
    side();
    requestAnimationFrame(frame);
  }

  function tempoTick(now) {
    var r = session.tick(clock);
    for (var i = 0; i < r.misses.length; i++) flash[r.misses[i]] = { color: "#7a2b35", until: now + FLASH_MS / 2 };
    if (r.misses.length) tempoMarks();
    if (r.result === "pass") {
      // Below the target a raise starts the clean count over, so the loop finishes after LOOP_CLEAN
      // clean passes at the target speed.
      var next = ramp && loop ? P.rampSpeed(session.speed, r.clean, rampTarget) : session.speed;
      if (next > session.speed) {
        session.setSpeed(next); session.cleanPasses = 0; playSpeed = next / 100; modeText();
        toast("Clean! Faster · " + next + "%");
      } else if (ramp && loop && !r.clean && session.speed < rampTarget) {
        toast("Not clean · holding " + session.speed + "%");
      } else {
        toast(r.clean ? "Clean! " + session.cleanPasses + " of " + session.cleanNeeded : "Not clean · again, 0 of " + session.cleanNeeded);
      }
      startClock();
      marks = {};
    }
    if (r.result === "done") { panel(); saveResult(); }
    if (r.misses.length || r.result) report();
  }

  // The sheet music marks for tempo mode, from the session's judgements: a beat with a missed note
  // is red, one with every note struck green (a wrong key there keeps it red).
  function tempoMarks() {
    for (var i in session.judged) {
      var at = song.notes[i].start;
      marks[at] = session.judged[i] === "miss" ? "bad" : marks[at] || "ok";
    }
  }

  // The count-in before a tempo-mode start: 1 2 3 4 in the middle of the screen.
  var shownCount = -1;
  function countShow() {
    var c = session && session.tempo && mode === "play" && !listen ? P.countIn(clock, session.range.start, session.range.countIn) : 0;
    if (c === shownCount) return;
    shownCount = c;
    $("count").textContent = c || ""; $("count").className = c ? "on" : "";
    report();
  }

  function draw(now) {
    var c = mode === "play" ? cal : work;

    // With the sheet music up, the falling notes run from just under it (or not at all on their own).
    var box = sheetBox(), areaTop = box ? box.y + box.h + Math.round(H * 0.012) : 0, falling = !box || curView() === "both";

    if (current) session.needed().forEach(function (x) { want[x] = session.hit && session.hit[x] ? "hit" : "want"; });
    // A tutorial step without highlights: the keys are not lit, the player finds them.
