<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
<title>Piano</title>
<style>
:root{
  --bg:#0b0f17;--card:#131a27;--line:#1c2433;--line2:#2a3446;
  --txt:#e8edf5;--txt2:#b7c2d6;--mut:#8b97ab;--dim:#5d687c;
  --blue:#4da3ff;--green:#3ddc84;--amber:#ffb020;--red:#ff5252;
  --rh:#8cc6ff;--lh:#ff9ff0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
/* 1rem is set from the viewport height in JS (20px at 1080 tall), so the text scales with the TV. */
#c{position:absolute;left:0;top:0;width:100%;height:100%}
.side{position:absolute;top:1.2rem;display:flex;flex-direction:column;gap:.9rem;font-variant-numeric:tabular-nums;line-height:1.25}
.side .lbl{font-size:.8rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
.side .val{font-size:1.6rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sub{font-size:.95rem;color:var(--txt2)}
#left{text-align:left}
#right{text-align:right}
#title{font-size:1.5rem;font-weight:800;line-height:1.15}
#status{font-size:.9rem;color:var(--txt2);line-height:1.4}
#status b.ok{color:var(--green)}#status b.bad{color:var(--amber)}
#hint{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);background:rgba(42,18,22,.95);border:.12rem solid var(--red);border-radius:.8rem;padding:.6rem 1.6rem;font-size:1.6rem;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .25s ease;pointer-events:none}
#hint.on{opacity:1}
#listen{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);background:rgba(16,38,28,.95);border:.12rem solid var(--green);border-radius:.8rem;padding:.6rem 1.6rem;font-size:1.6rem;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .25s ease;pointer-events:none;text-align:center}
#listen.on{opacity:1}
#listen .sub{display:block;font-size:.95rem;font-weight:600;color:var(--txt2)}
#toast{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);background:rgba(19,26,39,.95);border:.12rem solid var(--blue);border-radius:.8rem;padding:.6rem 1.6rem;font-size:1.6rem;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .25s ease;pointer-events:none}
#toast.on{opacity:1}
#want span.right{color:var(--rh)}#want span.left{color:var(--lh)}
#loopBox{display:none}#loopBox.on{display:block}
#loopVal{font-size:2.2rem;letter-spacing:.15em;color:var(--green)}
#keys{font-size:.8rem;color:var(--txt2);opacity:.65;line-height:1.5}
#panel{position:absolute;left:50%;top:1.2rem;transform:translateX(-50%);max-width:46rem;background:rgba(19,26,39,.95);border:.12rem solid var(--blue);border-radius:.8rem;padding:1rem 1.6rem;text-align:center;display:none}
#panel.on{display:block}
#panel h1{font-size:1.7rem;font-weight:800;margin-bottom:.4rem}
#panel p{font-size:1.05rem;color:var(--txt2);line-height:1.45}
#panel p b{color:var(--txt)}
#panel .step{font-size:.85rem;font-weight:700;color:var(--blue);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.3rem}
#panel .warn{color:var(--amber);margin-top:.4rem}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="left" class="side">
  <div id="title">Loading song…</div>
  <div><div class="lbl">Bar</div><div class="val" id="bar">-</div></div>
  <div><div class="lbl">Mode</div><div class="sub" id="mode">Wait mode · right hand</div></div>
  <div id="status"></div>
  <div id="keys">◀ ▶ song · ▲ hand · ⏯ loop · ⏪ hear · ⏩ wall</div>
</div>
<div id="right" class="side">
  <div><div class="lbl">Accuracy</div><div class="val" id="acc">-</div></div>
  <div><div class="lbl">Streak</div><div class="val" id="streak">0</div></div>
  <div><div class="lbl">Waiting for</div><div class="val" id="want">-</div></div>
  <div id="loopBox"><div class="lbl" id="loopLbl">Loop</div><div class="val" id="loopVal"></div><div class="sub" id="loopSub"></div></div>
</div>
<div id="hint"></div>
<div id="toast"></div>
<div id="listen"></div>
<div id="panel"></div>
<script src="/piano-core.js"></script>
<script src="/switch.js"></script>
<script>
(function () {
  "use strict";
  var P = window.PianoCore;
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("c"), ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  var LEAD_IN = 4;          // beats of falling notes before the first one reaches the hit line
  var LOOKAHEAD = 4.5;      // beats visible above the hit line
  var KEY_H = 0.16;         // on-screen keys, share of the screen height, on the very bottom edge
  var FLASH_MS = 700, HINT_MS = 2600;
  var ECHO_MS = 250;        // keys arriving this soon after Hear it first ends are still its echo
  // Per-hand colours: falling notes (white / black key lanes) and the keys a step is waiting for.
  var HAND = {
    right: { white: "#4da3ff", black: "#2f7fd6", want: "#8cc6ff" },
    left: { white: "#e26ad0", black: "#b9479f", want: "#ff9ff0" },
  };
  var HAND_NAMES = { right: "Right hand", left: "Left hand", both: "Both hands" };

  var saved = null;         // calibration from the server (null until one is saved)
  var cal = null;           // calibration in this screen's device pixels
  var work = null;          // calibration being edited in the calibration flow
  var layout = null;
  var mode = "play";        // play | cal1 | cal2 | cal3
  var calWarn = "";

  var songs = [], songId = "", rawSong = null, song = null, session = null, clock = -LEAD_IN, paused = false;
  var hand = rememberedHand();  // right | left | both, as chosen; the session may fall back to both
  var loop = null;          // { from, to } bars while practising a loop
  var held = {};            // note -> true while the key is down
  var flash = {};           // note -> { color, until }
  var hintUntil = 0;
  var online = false, presence = null;
  var listen = null;        // Hear it first while it plays: { plan, t0, clock, paused, label }
  var listenReq = null, echoUntil = 0;
  var fingers = rememberedFingers();  // finger numbers on the falling notes and lit keys

  // ---------- sizing ----------

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = Math.round(window.innerWidth * DPR); H = Math.round(window.innerHeight * DPR);
    canvas.width = W; canvas.height = H;
    document.documentElement.style.fontSize = Math.max(8, window.innerHeight / 54) + "px";
    applyCalibration();
    beacon();
  }

  function applyCalibration() {
    cal = saved ? P.scaleCalibration(saved, W) : P.defaultCalibration(W);
    if (work && work.screenPx !== W) { var m = work.mode; work = P.scaleCalibration(work, W); work.mode = m; }
    if (mode === "play") setLayout(cal);
    else setLayout(work);
    fitSong();
  }

  function setLayout(c) {
    layout = P.keyLayout(c);
    // Song info sits in the side margins outside the strip.
    var l = c.left / DPR, r = (W - c.right) / DPR, pad = window.innerHeight / 40;
    var ls = $("left").style, rs = $("right").style;
    ls.left = pad + "px"; ls.width = Math.max(120, l - 2 * pad) + "px";
    rs.right = pad + "px"; rs.width = Math.max(120, r - 2 * pad) + "px";
  }

  // ---------- song ----------

  function fitSong() {
    // A new keyboard range can move notes by an octave, so the song starts over when it changes.
    if (!rawSong || !cal) return;
    if (song && song.fitLow === cal.low && song.fitHigh === cal.high) return;
    song = P.fitSong(rawSong, cal.low, cal.high);
    song.fitLow = cal.low; song.fitHigh = cal.high;
    $("title").textContent = song.title;
    newSession();
  }

  // A fresh wait-mode session for the current song, hand and loop, with the clock in the lead-in.
  function newSession() {
    if (!song) return;
    cancelListen();
    loop = P.clampLoop(song, loop);
    session = P.createSession(song, { hand: hand, loop: loop });
    clock = session.range.start - LEAD_IN; paused = false; held = {};
    var only = song.hands.length < 2 ? " · " + song.hands[0] + " hand only" : "";
    $("mode").textContent = "Wait mode · " + HAND_NAMES[session.hand].toLowerCase() + only + " · " + song.bpm + " bpm" + (song.shifted ? " · " + song.shifted + " notes moved an octave" : "");
    lastSide = "";
    panel();
    report();
  }

  function rememberedFingers() {
    try { return localStorage.getItem("pianoFingers") !== "off"; } catch (e) { return true; }
  }

  // Link page toggle (or F): show or hide the finger numbers. id is "on", "off" or "" to toggle.
  function setFingers(id) {
    fingers = id === "on" ? true : id === "off" ? false : !fingers;
    try { localStorage.setItem("pianoFingers", fingers ? "on" : "off"); } catch (e) {}
    toast(fingers ? "Finger numbers on" : "Finger numbers off");
    report();
  }

  // Hear it first (remote ⏪, P, or the link page): the keyboard plays the bar being practised, or the
  // whole loop, at the song's tempo for the hand being practised. The TV runs the notes down and
  // lights each key as it sounds, then puts the song back where it was waiting. Pressing it again stops.
  function toggleListen() {
    if (mode !== "play" || !session || !song) return;
    if (listen || listenReq) return stopListen(true);
    var st = session.current(), bars = P.barCount(song);
    var from = loop ? loop.from : Math.min(bars, P.barOf(song, st ? st.start : clock)), to = loop ? loop.to : from;
    var plan = P.listenPlan(song, { hand: session.hand, from: from, to: to });
    if (!plan.events.length) { toast("Nothing to hear in " + barsText(plan)); return; }
    var req = listenReq = {};
    var events = plan.events.map(function (e) { return { note: e.note, at: e.at, dur: e.dur }; });
    postJson("/api/piano/listen", { events: events }, function (err, r) {
      if (req !== listenReq) return;
      listenReq = null;
      listen = { plan: plan, t0: Date.now() + P.LISTEN_LEAD_MS, clock: clock, paused: paused, label: barsText(plan) };
      held = {};
      var sub = err ? "Server unreachable: lights only" : !(r && r.output) ? "No keyboard output on the link page: lights only" : "then it is your turn";
      $("toast").className = "";
      $("listen").innerHTML = "♪ Listen · " + esc(barsText(plan)) + " · " + HAND_NAMES[plan.hand].toLowerCase() + '<span class="sub">' + esc(sub) + "</span>";
      $("listen").className = "on";
      lastSide = "";
      report();
    });
  }

  // Ends Hear it first: tell is true when the keyboard must stop too (stopped early, song changed).
  function stopListen(tell) {
    if (tell && (listen || listenReq)) postJson("/api/piano/listen", { stop: true }, function () {});
    listenReq = null;
    if (!listen) return;
    clock = listen.clock; paused = listen.paused; listen = null;
    echoUntil = Date.now() + ECHO_MS;
    $("listen").className = "";
    lastSide = "";
    report();
  }

  function cancelListen() { if (listen || listenReq) stopListen(true); }

  function rememberedHand() {
    var h = "";
    try { h = localStorage.getItem("pianoHand") || ""; } catch (e) {}
    return HAND_NAMES[h] ? h : "right";
  }

  // Remote ▲ and the link page: right, left or both hands.
  function setHand(h) {
    if (mode !== "play" || !HAND_NAMES[h]) return;
    hand = h;
    try { localStorage.setItem("pianoHand", hand); } catch (e) {}
    newSession();
    if (song && session.hand !== hand) toast(song.title + " has the " + song.hands[0] + " hand only");
    else toast(HAND_NAMES[hand]);
  }

  // Practice loop over bars from..to; null stops it. The song starts again either way.
  function setLoop(l) {
    if (mode !== "play" || !song) return;
    loop = l && l.from ? l : null;
    newSession();
    toast(loop ? "Loop " + barsText(loop) + " · " + session.cleanNeeded + " clean in a row" : "Loop off");
  }

  function barsText(l) { return l.from === l.to ? "bar " + l.from : "bars " + l.from + "–" + l.to; }

  // Remote ⏯ (or L): loop the bar being played, or stop looping.
  function toggleLoop() {
    if (!session) return;
    if (loop) return setLoop(null);
    var st = session.current(), bar = P.barOf(song, st ? st.start : clock);
    setLoop({ from: bar, to: bar });
  }

  // Remote ◀ ▶ while looping: move the loop by a bar, keeping its length.
  function moveLoop(dir) {
    if (!loop) return;
    var len = loop.to - loop.from, bars = P.barCount(song);
    var from = Math.max(1, Math.min(bars - len, loop.from + dir));
    if (from !== loop.from) setLoop({ from: from, to: from + len });
  }

  // Which song plays: the one asked for (remote or link page), else ?song=, else the last one
  // played on this TV, else the first song in songs/.
  function remembered() { try { return localStorage.getItem("pianoSong") || ""; } catch (e) { return ""; } }
  function loadSong(id) {
    var want = /[?&]song=([^&]+)/.exec(location.search);
    getJson("/api/piano/songs", function (err, list) {
      if (err) { $("title").textContent = "Songs unavailable"; return setTimeout(function () { loadSong(id); }, 10000); }
      songs = list.songs;
      var ok = songs.filter(function (s) { return !s.error; });
      function find(x) { return x && ok.filter(function (s) { return s.id === x; })[0]; }
      var pick = find(id) || find(want && decodeURIComponent(want[1])) || find(remembered()) || ok[0];
      if (!pick) { $("title").textContent = "No songs in songs/"; return; }
      getJson("/api/piano/songs/" + encodeURIComponent(pick.id), function (err2, s) {
        if (err2) { $("title").textContent = "Song failed to load"; return setTimeout(function () { loadSong(id); }, 10000); }
        songId = pick.id;
        try { localStorage.setItem("pianoSong", songId); } catch (e) {}
        rawSong = s; song = null; session = null; held = {}; loop = null;
        fitSong();
        if (id) toast(s.title);
      });
    });
  }

  // Remote Left / Right (and the link page) pick the previous / next song.
  function stepSong(dir) {
    if (mode !== "play" || !songs.length) return;
    loadSong(P.stepSong(songs, songId, dir));
  }

  var toastTimer = null;
  function toast(text) {
    var el = $("toast");
    el.textContent = text; el.className = "on";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ""; }, 1800);
  }

  var leaving = false;
  function toWall() {
    if (leaving) return;
    leaving = true;
    toast("Switching to wall…");
    setTimeout(function () { location.href = TVSwitch.PATHS.wall; }, 150);
  }

  function restart() {
    if (!session) return;
    cancelListen();
    session.restart(); clock = session.range.start - LEAD_IN; paused = false; held = {};
    panel();
    report();
  }

  // ---------- input ----------

  function noteOn(n) {
    // What Hear it first plays (and any echo of it) is not the player's input.
    if (mode === "play" && (listen || listenReq || Date.now() < echoUntil)) return;
    held[n] = true;
    if (mode === "cal1") { work.low = n; calNote(); return; }
    if (mode === "cal2") { work.high = n; calNote(); return; }
    if (mode === "cal3" || !session) return;
    if (session.done) { restart(); held[n] = true; }
    var r = session.press(n);
    if (r.result === "wrong") {
      // A wrong key stays red while it is held down, then fades.
      flash[n] = { color: "#ff5252", until: Infinity };
      $("hint").textContent = r.hint; $("hint").className = "on"; hintUntil = Date.now() + HINT_MS;
    } else if (r.result !== "ignored") {
      flash[n] = { color: "#3ddc84", until: Date.now() + FLASH_MS };
      $("hint").className = ""; hintUntil = 0;
    }
    if (r.result === "pass") {
      // One time through the loop: say whether it was clean and start the bars again.
      toast(r.clean ? "Clean! " + session.cleanPasses + " of " + session.cleanNeeded : "Not clean · again, 0 of " + session.cleanNeeded);
      clock = session.range.start - LEAD_IN / 2;
    }
    if (r.result === "done") panel();
    report();
  }

  function noteOff(n) {
    delete held[n];
    if (flash[n] && flash[n].until === Infinity) flash[n].until = Date.now() + FLASH_MS / 2;
  }

  function calNote() {
    // Keep the range sane while someone is still finding the end keys.
    if (work.high - work.low < 12) { if (mode === "cal1") work.high = work.low + 60; else work.low = work.high - 60; }
    calWarn = "";
    if (mode === "cal1" && work.low % 12 !== 0) calWarn = "Lowest key read as " + P.noteName(work.low) + ", not a C: switch off Transpose on the Casio, then press it again.";
    if (mode === "cal2" && work.high % 12 !== 0) calWarn = "Highest key read as " + P.noteName(work.high) + ", not a C: switch off Transpose on the Casio, then press it again.";
    if (work.low < 0) work.low = 0;
    if (work.high > 127) work.high = 127;
    setLayout(work); panel();
  }

  function startCalibration() {
    cancelListen();
    work = { low: cal.low, high: cal.high, left: cal.left, right: cal.right, screenPx: W, mode: "seat" };
    mode = "cal1"; calWarn = ""; held = {};
    setLayout(work); panel(); report();
  }

  function nudge(px) {
    if (mode === "cal1") work.left = Math.min(work.right - 100, work.left + px);
    else if (mode === "cal2") work.right = Math.max(work.left + 100, work.right + px);
    else return;
    setLayout(work); panel();
  }

  function ok() {
    if (mode === "cal1") { mode = "cal2"; calWarn = ""; panel(); }
    else if (mode === "cal2") { mode = "cal3"; calWarn = ""; panel(); }
    else if (mode === "cal3") save();
    else if (session && session.done) restart();
    else paused = !paused;
    report();
  }

  function back() {
    if (mode === "cal3") { mode = "cal2"; panel(); }
    else if (mode === "cal2") { mode = "cal1"; panel(); }
    else if (mode === "cal1") { mode = "play"; setLayout(cal); panel(); }
    report();
  }

  function save() {
    postJson("/api/piano/calibration", work, function (err, c) {
      if (err) { calWarn = "Could not save: " + err; panel(); return; }
      saved = c; mode = "play"; panel(); applyCalibration(); report();
    });
  }

  function control(c) {
    if (c.cmd === "calibrate") startCalibration();
    else if (c.cmd === "nudge") nudge(c.px || 0);
    else if (c.cmd === "ok") ok();
    else if (c.cmd === "back") back();
    else if (c.cmd === "restart") { if (mode !== "play") { mode = "play"; setLayout(cal); } restart(); }
    else if (c.cmd === "pause" && mode === "play") { paused = !paused; report(); }
    else if (c.cmd === "song") { if (mode === "play" && c.id) loadSong(c.id); }
    else if (c.cmd === "hand") setHand(c.id);
    else if (c.cmd === "loop") setLoop(c.from ? { from: c.from, to: c.to || c.from } : null);
    else if (c.cmd === "listen") toggleListen();
    else if (c.cmd === "fingers") setFingers(c.id);
  }

  // Play-pause on the Fire TV remote; L on a keyboard.
  function isLoopKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return false;
    return e.key === "MediaPlayPause" || e.key === "l" || e.key === "L" || ((e.key === undefined || e.key === "Unidentified") && (e.keyCode === 179 || e.keyCode === 85));
  }

  // Remote: while calibrating ◀ ▶ move the edge line 1 device pixel (10 when held or with Shift), OK
  // confirms, Back steps back. In play, ◀ ▶ pick the previous / next song (or move the loop while
  // looping), ▲ (or H) cycles right / left / both hands, ⏯ (or L) loops the current bar or stops the
  // loop, OK pauses (or replays a finished song), ▼ or C calibrates, ⏪ (or P) plays the bar first
  // (Hear it first), ⏩ (or M) switches to the wall and F shows or hides the finger numbers.
  document.addEventListener("keydown", function (e) {
    var k = e.key, step = e.repeat || e.shiftKey ? 10 : 1;
    if (TVSwitch.isListenKey(e)) { e.preventDefault(); if (!e.repeat) toggleListen(); }
    else if (TVSwitch.isSwitchKey(e)) { e.preventDefault(); if (!e.repeat) toWall(); }
    else if (isLoopKey(e)) { e.preventDefault(); if (!e.repeat && mode === "play") toggleLoop(); }
    else if (k === "ArrowLeft") { if (mode === "play") { if (!e.repeat) loop ? moveLoop(-1) : stepSong(-1); } else nudge(-step); e.preventDefault(); }
    else if (k === "ArrowRight") { if (mode === "play") { if (!e.repeat) loop ? moveLoop(1) : stepSong(1); } else nudge(step); e.preventDefault(); }
    else if ((k === "ArrowUp" || k === "h" || k === "H") && mode === "play") { if (!e.repeat) setHand(P.nextHand(hand)); e.preventDefault(); }
    else if (k === "Enter" || k === " ") { ok(); e.preventDefault(); }
    else if (k === "Escape" || k === "Backspace" || k === "GoBack" || k === "BrowserBack") { if (mode !== "play") { back(); e.preventDefault(); } }
    else if ((k === "ArrowDown" || k === "c" || k === "C") && mode === "play") { startCalibration(); e.preventDefault(); }
    else if ((k === "r" || k === "R") && mode === "play") restart();
    else if ((k === "f" || k === "F") && mode === "play") setFingers("");
  });

  // ---------- relay ----------

  function connect() {
    var es = new EventSource("/api/piano/events?role=tv");
    es.onopen = function () { online = true; status(); };
    es.onerror = function () { online = false; status(); };
    es.addEventListener("midi", function (m) {
      var d = JSON.parse(m.data);
      for (var i = 0; i < d.events.length; i++) {
        var ev = d.events[i];
        if (ev.on && ev.velocity > 0) noteOn(ev.note); else noteOff(ev.note);
      }
    });
    es.addEventListener("control", function (m) { control(JSON.parse(m.data)); });
    es.addEventListener("switch", function (m) {
      try { if (TVSwitch.pathFor(JSON.parse(m.data).to, location.pathname)) toWall(); } catch (e) {}
    });
    es.addEventListener("calibration", function (m) {
      var c = JSON.parse(m.data);
      if (c && (!saved || c.savedAt !== saved.savedAt)) { saved = c; if (mode === "play") applyCalibration(); }
      if (!c && !saved && mode === "play" && !connect.asked) { connect.asked = true; startCalibration(); }
    });
    es.addEventListener("presence", function (m) { presence = JSON.parse(m.data); status(); });
    // The songs folder changed: a new song joins the ◀ ▶ list, and the song on screen loads again
    // when its file (or its import settings) changed.
    es.addEventListener("songs", function (m) {
      var d = JSON.parse(m.data);
      songs = d.songs;
      if (!rawSong || (mode === "play" && d.changed.indexOf(songId) >= 0)) loadSong(songId);
    });
  }

  function status() {
    var s = [];
    s.push(online ? "Server <b class=ok>connected</b>" : "Server <b class=bad>reconnecting…</b>");
    if (presence) {
      if (presence.device) s.push("Keyboard <b class=ok>" + esc(presence.device) + "</b>");
      else if (presence.link) s.push("Keyboard <b class=bad>not found</b>: plug the Casio into the Mac");
      else s.push("Keyboard <b class=bad>no link page</b>: open localhost:4410/piano/link in Chrome on the Mac");
    }
    s.push(saved ? "Calibrated " + new Date(saved.savedAt).toLocaleDateString() : "Not calibrated: ▼ to calibrate");
    $("status").innerHTML = s.join("<br>");
  }

  var reportTimer = null;
  // Mirror the play state to the link page (throttled).
  function report() {
    if (reportTimer) return;
    reportTimer = setTimeout(function () {
      reportTimer = null;
      var st = snapshot();
      postJson("/api/piano/state", st, function () {});
    }, 150);
  }

  function snapshot() {
    return {
      mode: mode, paused: paused,
      songId: songId, song: song ? song.title : "", step: session ? session.index : 0, steps: session ? session.steps.length : 0,
      hand: hand, playHand: session ? session.hand : hand, songHands: song ? song.hands : [], bars: song ? P.barCount(song) : 0,
      loop: loop, cleanPasses: session ? session.cleanPasses : 0, cleanNeeded: session ? session.cleanNeeded : P.LOOP_CLEAN, passes: session ? session.passes : 0,
      done: session ? session.done : false,
      listening: listen ? listen.label : "", fingers: fingers,
      waitingFor: session ? session.waitingFor().map(P.noteName) : [],
      accuracy: session ? Math.round(session.accuracy() * 100) : 100, streak: session ? session.streak : 0,
      correct: session ? session.correct : 0, wrong: session ? session.wrong : 0,
      hint: session && session.lastWrong ? session.lastWrong.hint : "",
      calibration: mode === "play" ? cal : work, screenPx: W,
    };
  }
  window.pianoState = snapshot;

  // ---------- panel text ----------

  function panel() {
    var p = $("panel"), h = "";
    if (mode === "cal1") h = "<div class=step>Calibrate · step 1 of 3</div><h1>Press your lowest key</h1>" +
      "<p>Then use <b>◀ ▶</b> until the <b>left blue line</b> sits on the left edge of that key, as seen from the stool. <b>OK</b> when it lines up.</p>" +
      "<p>Lowest key: <b>" + P.noteName(work.low) + "</b> · line at " + Math.round(work.left) + " px</p>";
    else if (mode === "cal2") h = "<div class=step>Calibrate · step 2 of 3</div><h1>Press your highest key</h1>" +
      "<p>Then use <b>◀ ▶</b> until the <b>right blue line</b> sits on the right edge of that key. <b>OK</b> when it lines up.</p>" +
      "<p>Range: <b>" + P.noteName(work.low) + "–" + P.noteName(work.high) + "</b> (" + (work.high - work.low + 1) + " keys) · line at " + Math.round(work.right) + " px</p>";
    else if (mode === "cal3") h = "<div class=step>Calibrate · step 3 of 3</div><h1>Play a few keys anywhere</h1>" +
      "<p>Each key lights a beam straight above itself. If the beams line up, press <b>OK</b> to save. <b>Back</b> redoes the edges.</p>";
    else if (session && session.done && loop) h = "<div class=step>Loop finished</div><h1>" + esc(barsText(loop).replace(/^b/, "B")) + " clean " + session.cleanNeeded + " times in a row!</h1>" +
      "<p>" + session.passes + " passes · accuracy <b>" + Math.round(session.accuracy() * 100) + "%</b>. <b>OK</b> loops again, <b>⏯</b> stops the loop, <b>▶</b> moves to the next bar.</p>";
    else if (session && session.done) h = "<div class=step>Finished</div><h1>Well played!</h1>" +
      "<p>Accuracy <b>" + Math.round(session.accuracy() * 100) + "%</b> · best streak <b>" + session.bestStreak + "</b>. Press <b>OK</b> or play any key to go again.</p>";
    if (calWarn) h += "<p class=warn>" + esc(calWarn) + "</p>";
    p.innerHTML = h; p.className = h ? "on" : "";
    status();
  }

  // ---------- drawing ----------

  function frame(t) {
    var now = Date.now(), dt = Math.min(100, t - (frame.last || t));
    frame.last = t;
    if (listen) {
      // Hear it first runs the clock through the bars at tempo, whatever wait mode is waiting for.
      var el = now - listen.t0;
      if (el >= listen.plan.ms) stopListen(false);
      else clock = listen.plan.startBeat + el / listen.plan.beatMs;
    } else if (session && mode === "play" && !paused) {
      // A finished song keeps falling away instead of freezing on screen.
      var st = session.current();
      clock = P.advanceClock(clock, dt, song.bpm, st ? st.start : null);
    }
    if (hintUntil && now > hintUntil) { $("hint").className = ""; hintUntil = 0; }
    draw(now);
    side();
    requestAnimationFrame(frame);
  }

  function draw(now) {
    var c = mode === "play" ? cal : work;
    var keyTop = Math.round(H * (1 - KEY_H)), hitY = keyTop - Math.round(H * 0.006);
    var ppb = hitY / LOOKAHEAD;
    ctx.fillStyle = "#0b0f17"; ctx.fillRect(0, 0, W, H);

    // Lanes: faint lines at the white-key boundaries inside the strip.
    ctx.fillStyle = "#121a28";
    ctx.fillRect(c.left, 0, c.right - c.left, keyTop);
    ctx.fillStyle = "#1a2333";
    for (var n = layout.low; n <= layout.high; n++) {
      var k = layout.keys[n];
      if (!k.black && (n % 12 === 0 || n % 12 === 5)) ctx.fillRect(Math.round(k.x0), 0, Math.max(1, Math.round(DPR)), keyTop);
    }

    var want = {}, current = session && mode === "play" && !listen ? session.current() : null;
    if (current) current.notes.forEach(function (x) { want[x] = session.hit[x] ? "hit" : "want"; });
    var lo = loop ? session.range.start : -Infinity, hi = loop ? session.range.end : Infinity;
    // While Hear it first plays, the keys sounding now are lit instead of the ones wait mode wants.
    var lp = listen && listen.plan, snd = lp ? P.sounding(lp, now - listen.t0) : {};
    for (var sn in snd) want[sn] = "sound";

    // Falling notes, clipped at the hit line.
    if (song && session && mode === "play") {
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, hitY); ctx.clip();
      var curStart = current ? current.start : Infinity, gap = Math.max(2, Math.round(DPR * 2));
      for (var i = 0; i < song.notes.length; i++) {
        var nt = song.notes[i], key = layout.keys[nt.note];
        if (!key) continue;
        var bottom = hitY - (nt.start - clock) * ppb, top = bottom - nt.length * ppb;
        if (bottom < 0 || top > hitY) continue;
        // Notes the session does not ask for (the other hand, bars outside the loop) are dimmed.
        var hc = HAND[nt.hand] || HAND.right, mine, isCur, col;
        if (lp) {
          mine = (lp.hand === "both" || nt.hand === lp.hand) && nt.start >= lp.startBeat - 1e-6 && nt.start < lp.endBeat - 1e-6;
          isCur = mine && snd[nt.note] && nt.start <= clock + 1e-6 && nt.start + nt.length > clock;
          col = isCur ? hc.want : (key.black ? hc.black : hc.white);
        } else {
          mine = (session.hand === "both" || nt.hand === session.hand) && nt.start >= lo - 1e-6 && nt.start < hi - 1e-6;
          isCur = mine && Math.abs(nt.start - curStart) < 1e-6;
          col = !mine ? (key.black ? hc.black : hc.white) : nt.start < curStart ? "#2b7a52" : isCur ? (want[nt.note] === "hit" ? "#3ddc84" : hc.want) : (key.black ? hc.black : hc.white);
        }
        roundRect(key.x0 + gap, top + gap, key.x1 - key.x0 - 2 * gap, bottom - top - 2 * gap, Math.min(10 * DPR, (key.x1 - key.x0) / 3));
        ctx.globalAlpha = mine ? 1 : 0.22;
        ctx.fillStyle = col; ctx.fill();
        if (isCur && want[nt.note] !== "hit") { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2 * DPR; ctx.stroke(); }
        if (nt.shifted) { ctx.strokeStyle = "#a78bfa"; ctx.lineWidth = 2 * DPR; ctx.stroke(); }
        // Finger number at the bottom of the note's visible part, where it meets the key.
        var fs = Math.min((key.x1 - key.x0) * 0.8, 30 * DPR), seen = Math.min(bottom, hitY);
        if (fingers && nt.finger && seen - top - 2 * gap > fs * 1.2) {
          fingerText(nt.finger, (key.x0 + key.x1) / 2, seen - gap - fs * 0.65, fs, col === "#2b7a52" ? "#d8f5e6" : "#07101d");
        }
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    // Check step: every held key lights a beam straight above itself.
    if (mode === "cal3") {
      for (var b in held) {
        var bk = layout.keys[b];
        if (!bk) continue;
        var g = ctx.createLinearGradient(0, 0, 0, keyTop);
        g.addColorStop(0, "rgba(77,163,255,0)"); g.addColorStop(1, "rgba(77,163,255,.85)");
        ctx.fillStyle = g; ctx.fillRect(bk.x0, 0, bk.x1 - bk.x0, keyTop);
      }
    }

    // Hit line.
    ctx.fillStyle = "#2a3446"; ctx.fillRect(c.left, hitY, c.right - c.left, Math.max(2, Math.round(2 * DPR)));

    // Keys: whites first, blacks on top at their real offsets.
    var blackH = Math.round((H - keyTop) * 0.62);
    for (var pass = 0; pass < 2; pass++) {
      for (var m = layout.low; m <= layout.high; m++) {
        var kk = layout.keys[m];
        if (kk.black !== (pass === 1)) continue;
        var fl = flash[m] && flash[m].until > now ? flash[m].color : null;
        var fill = kk.black ? "#10141c" : "#e9edf3";
        if (want[m] === "want") fill = (HAND[current.hands[m]] || HAND.right).want;
        else if (want[m] === "sound") fill = (HAND[snd[m].hand] || HAND.right).want;
        if (held[m]) fill = mode === "play" ? (want[m] === "hit" || (fl === "#3ddc84") ? "#3ddc84" : fl || (kk.black ? "#3a4a66" : "#9fb3d1")) : "#4da3ff";
        else if (fl) fill = fl;
        var x0 = Math.round(kk.x0), x1 = Math.round(kk.x1);
        ctx.fillStyle = fill;
        if (kk.black) ctx.fillRect(x0, keyTop, x1 - x0, blackH);
        else {
          ctx.fillRect(x0 + 1, keyTop, x1 - x0 - Math.max(1, Math.round(DPR)), H - keyTop);
        }
        // The lit key carries the finger that plays it.
        var lf = !fingers || held[m] ? 0 : want[m] === "want" ? current.fingers && current.fingers[m] : want[m] === "sound" ? snd[m].finger : 0;
        if (lf) fingerText(lf, (x0 + x1) / 2, kk.black ? keyTop + blackH * 0.72 : keyTop + (H - keyTop) * 0.8, Math.min((x1 - x0) * 0.75, 28 * DPR), "#07101d");
      }
    }

    // Calibration edge lines and the range labels.
    if (mode === "cal1" || mode === "cal2") {
      edge(work.left, mode === "cal1"); edge(work.right, mode === "cal2");
    }
  }

  function fingerText(f, cx, cy, size, color) {
    ctx.font = "800 " + Math.round(size) + 'px -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = color; ctx.fillText(String(f), cx, cy);
  }

  function edge(x, active) {
    ctx.fillStyle = active ? "#4da3ff" : "rgba(77,163,255,.35)";
    var w = active ? Math.max(2, Math.round(DPR * 1.5)) : Math.max(1, Math.round(DPR));
    ctx.fillRect(Math.round(x) - Math.floor(w / 2), 0, w, H);
  }

  function roundRect(x, y, w, h, r) {
    if (w <= 0 || h <= 0) { ctx.beginPath(); return; }
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  }

  var lastSide = "";
  function side() {
    if (!session) return;
    var bar = P.barOf(song, clock), bars = P.barCount(song);
    var st = session.current(), waiting = session.waitingFor();
    var wantNames = waiting.map(P.noteName).join(" ");
    var key = [bar, bars, session.correct, session.wrong, session.streak, wantNames, session.done, paused, session.passes, session.cleanPasses, session.passWrong, listen ? listen.label : ""].join("|");
    if (key === lastSide) return;
    lastSide = key;
    $("bar").textContent = listen ? Math.min(bar, bars) + " of " + bars + " · listen" : session.done ? "Finished" : Math.min(bar, bars) + " of " + bars + (paused ? " · paused" : "");
    $("acc").textContent = session.correct + session.wrong ? Math.round(session.accuracy() * 100) + "%" : "-";
    $("streak").textContent = session.streak + (session.bestStreak > session.streak ? " (best " + session.bestStreak + ")" : "");
    // Each waiting note in its hand's colour.
    $("want").innerHTML = session.done ? "OK to replay" : waiting.length ? waiting.map(function (n) {
      return '<span class="' + (st.hands[n] || "right") + '">' + P.noteName(n) + "</span>";
    }).join(" ") : "-";
    $("want").style.color = session.done ? "#3ddc84" : "";
    // Practice loop counter: one dot per clean pass still needed in a row.
    $("loopBox").className = loop ? "on" : "";
    if (loop) {
      var dots = "";
      for (var i = 0; i < session.cleanNeeded; i++) dots += i < session.cleanPasses ? "●" : "○";
      $("loopLbl").textContent = "Loop · " + barsText(loop);
      $("loopVal").textContent = dots;
      $("loopSub").textContent = session.cleanPasses + " of " + session.cleanNeeded + " clean in a row" +
        (session.passWrong && !session.done ? " · this pass has a mistake" : "") + " · pass " + (session.passes + (session.done ? 0 : 1));
    }
    $("keys").textContent = (loop ? "◀ ▶ move loop · ⏯ loop off · ⏪ hear the loop" : "◀ ▶ song · ⏯ loop bar · ⏪ hear the bar") + " · ▲ hand · ⏩ wall";
  }

  // ---------- helpers ----------

  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }

  function getJson(url, cb) {
    var x = new XMLHttpRequest();
    x.open("GET", url); x.timeout = 15000;
    x.onload = function () { try { x.status === 200 ? cb(null, JSON.parse(x.responseText)) : cb("HTTP " + x.status); } catch (e) { cb(String(e)); } };
    x.onerror = x.ontimeout = function () { cb("network"); };
    x.send();
  }

  function postJson(url, body, cb) {
    var x = new XMLHttpRequest();
    x.open("POST", url); x.timeout = 15000; x.setRequestHeader("Content-Type", "application/json");
    x.onload = function () {
      var d = null;
      try { d = JSON.parse(x.responseText); } catch (e) {}
      x.status === 200 ? cb(null, d) : cb((d && d.error) || "HTTP " + x.status);
    };
    x.onerror = x.ontimeout = function () { cb("network"); };
    x.send(JSON.stringify(body));
  }

  // Report the real viewport to the server log, like the wall page, so TV sizing can be diagnosed.
  function beacon() {
    try {
      new Image().src = "/api/debug?page=piano&w=" + window.innerWidth + "&h=" + window.innerHeight + "&dpr=" + window.devicePixelRatio +
        "&sw=" + (screen.width || 0) + "&sh=" + (screen.height || 0) + "&ua=" + encodeURIComponent(navigator.userAgent) + "&t=" + Date.now();
    } catch (e) {}
  }

  resize();
  window.addEventListener("resize", resize);
  setTimeout(resize, 500); setTimeout(resize, 3000); // the viewport can settle after first paint on some WebViews
  status();
  loadSong();
  connect();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
